<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elementals Unbound Playtest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: a card table. Opponent on top, you on the bottom, the turn bar between, a running log on the right. */
:root{
  --bg:#101318; --surface:#171c23; --raise:#202733; --line:#2f3946; --ink:#ebe6da; --mute:#97a1ac;
  --brass:#cda54d; --sapph:#76a2ff; --good:#74d184; --bad:#ef6b5b;
  --fire:#ea6a3e; --water:#43a0e4; --earth:#b88f4f; --wind:#62cdb1; --lightning:#e8cd47; --volcano:#e2833f; --wildfire:#f0a04b; --plasma:#ec6fb2; --steam:#a9c4d6; --swamp:#7f9a5a; --ice:#9fdcf2; --storm:#7b8cf0; --sand:#d8c08a; --metal:#a3acb9; --tempest:#a6e07a;
  --geyser:#d68f74; --mirage:#f0c896; --aurora:#b48af5; --ash:#a59089; --forge:#c7703f; --solar:#ffd86a; --glacier:#7ea9e0; --quicksilver:#cfd4ee; --hurricane:#4fb0c6; --glass:#bdeee6;
  --f-display:"Alegreya SC", Georgia, "Times New Roman", serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.35}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
#app{padding-inline:16px;padding-block:14px;max-width:1440px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
.el-volcano{--el:var(--volcano)} .el-wildfire{--el:var(--wildfire)} .el-plasma{--el:var(--plasma)} .el-steam{--el:var(--steam)} .el-swamp{--el:var(--swamp)} .el-ice{--el:var(--ice)} .el-storm{--el:var(--storm)} .el-sand{--el:var(--sand)} .el-metal{--el:var(--metal)} .el-tempest{--el:var(--tempest)} .el-geyser{--el:var(--geyser)} .el-mirage{--el:var(--mirage)} .el-aurora{--el:var(--aurora)} .el-ash{--el:var(--ash)} .el-forge{--el:var(--forge)} .el-solar{--el:var(--solar)} .el-glacier{--el:var(--glacier)} .el-quicksilver{--el:var(--quicksilver)} .el-hurricane{--el:var(--hurricane)} .el-glass{--el:var(--glass)} .el-fire{--el:var(--fire)} .el-water{--el:var(--water)} .el-earth{--el:var(--earth)} .el-wind{--el:var(--wind)} .el-lightning{--el:var(--lightning)}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#1a1408;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn:focus-visible,.card:focus-visible{outline:2px solid var(--sapph);outline-offset:2px}
.muted{color:var(--mute)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:700}

/* Setup */
.setup{display:grid;gap:22px}
.setup header p{max-width:62ch;color:var(--mute);margin:.4em 0 0}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px;align-content:start}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tiles.conf .tile{padding:5px 10px;min-width:0} .tiles.conf .tile span{font-size:11px}
.tile{border:1px solid var(--line);background:var(--raise);border-radius:6px;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;min-width:96px}
.tile b{font-family:var(--f-display);color:var(--el);font-size:16px}
.tile span{font-size:12px;color:var(--mute)}
.tile.on{border-color:var(--el);box-shadow:inset 0 0 0 1px var(--el)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.decklist{display:grid;gap:10px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--mute)}
.tab.on{color:var(--ink);border-bottom-color:var(--brass)}
.decks{display:grid;gap:8px}
.levels{display:grid;gap:6px}
.lvrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.lvbtn{display:grid;justify-items:center;gap:1px;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 2px;cursor:pointer}
.lvbtn b{font-family:var(--f-display);font-size:18px;line-height:1}
.lvbtn span{font-size:11px;color:var(--mute)}
.lvbtn.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.lvbtn.on b{color:var(--brass)}
.lvbtn:focus-visible{outline:2px solid var(--sapph);outline-offset:2px}
.lvdesc{margin:0;font-size:13px}
.deckbtn{--el:var(--mute);display:grid;gap:3px;text-align:left;background:var(--raise);border:1px solid var(--line);border-left:4px solid var(--el);border-radius:6px;padding:8px 12px;cursor:pointer}
.deckbtn.on{border-color:var(--el);box-shadow:inset 0 0 0 1px var(--el)}
.deckbtn:focus-visible,.tab:focus-visible,.fbtn:focus-visible,.tile:focus-visible{outline:2px solid var(--sapph);outline-offset:2px}
.dk-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dk-top b{font-family:var(--f-display);font-size:16px;color:var(--el)}
.dk-desc{font-size:13px;color:var(--mute)}
.tier{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border-radius:10px;padding:1px 8px;border:1px solid currentColor;white-space:nowrap}
.t-starter{color:var(--brass)} .t-common{color:var(--mute)} .t-uncommon{color:var(--water)} .t-rare{color:var(--lightning)} .t-special{color:var(--aurora)}
.rt{font-weight:700} .r-s{color:var(--brass)} .r-c{color:var(--mute)} .r-u{color:var(--water)} .r-r{color:var(--lightning)} .r-t{color:var(--mute)}
.filters{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.frow .lbl{min-width:64px}
.wr-scroll{overflow:auto;max-height:75vh;border:1px solid var(--line);border-radius:8px;margin-top:10px;background:var(--surface)}
table.wr{border-collapse:separate;border-spacing:0;font-size:12px;font-variant-numeric:tabular-nums}
table.wr th,table.wr td{padding:3px 5px;border-bottom:1px solid var(--line);border-right:1px solid color-mix(in srgb,var(--line) 50%,transparent);text-align:center;white-space:nowrap}
table.wr thead th{position:sticky;top:0;z-index:2;background:var(--raise);vertical-align:bottom;color:var(--el,var(--ink))}
table.wr .wr-col{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;max-height:130px;font-weight:700}
table.wr th.wr-row{position:sticky;left:0;z-index:1;background:var(--raise);text-align:left;border-left:4px solid var(--el,var(--line))}
table.wr th.wr-row b{color:var(--el,var(--ink))}
table.wr .wr-corner{left:0;z-index:3;text-align:left;color:var(--mute);font-weight:500}
table.wr td.wr-self,table.wr td.wr-na{color:var(--mute)}
.wr-link{background:none;border:none;padding:0;cursor:pointer;color:inherit;font:inherit;text-decoration:underline dotted}
.wr-focus{margin-top:12px}
.fbtn{background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:3px 11px;cursor:pointer;font-size:13px}
.fbtn.on{border-color:var(--brass);color:var(--brass);font-weight:700}
#libq{flex:1 1 220px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;color:var(--ink);font:inherit}
.libcount{margin:4px 0 0}
.libgrid{padding-top:12px}
.from{font-size:11px;margin-top:4px;padding-top:4px;border-top:1px dashed var(--line);color:var(--mute)}
.from span{color:var(--el);font-weight:700}
.forge{display:grid;gap:12px;padding-top:12px}
.forge-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.forge-cols.n3{grid-template-columns:1fr 1fr 1fr}
@media (max-width:640px){.forge-cols,.forge-cols.n3{grid-template-columns:1fr}}
.flist{display:grid;gap:3px;max-height:340px;overflow:auto;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--raise)}
.frow-card{display:grid;grid-template-columns:26px 1fr auto auto;gap:8px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-left:3px solid var(--el);border-radius:4px;padding:4px 8px;cursor:pointer;font:inherit;color:inherit}
.frow-card:hover{background:var(--bg)}
.frow-card.on{border-color:var(--brass);background:var(--bg);font-weight:700}
.frow-card.special i{color:var(--brass);font-style:normal;font-size:11px}
.fc-cost{font-weight:800;text-align:center}
.fc-st{color:var(--mute);font-size:12px}
.forge-eq{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.forge-eq .op{font-size:26px;font-weight:800;color:var(--mute)}
.card.forged{box-shadow:0 0 0 2px var(--brass)}
.card.ghost{border-style:dashed;opacity:.6;display:grid;place-items:center;min-height:120px}
.remind{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12px;margin:0;color:var(--mute)}
.remind dt{font-weight:700;color:var(--ink)}
.cards{display:flex;flex-wrap:wrap;gap:12px;padding-top:8px}

/* Cards */
.card{--el:var(--mute);width:128px;min-height:162px;background:var(--raise);border:1px solid var(--line);border-top:4px solid var(--el);border-radius:6px;padding:7px 7px 6px;display:flex;flex-direction:column;gap:3px;font-size:12px;position:relative;transition:transform .12s, outline-color .12s}
.card .cost{position:absolute;top:-10px;left:-9px;width:24px;height:24px;border-radius:50%;background:var(--brass);color:#1a1408;font-weight:700;display:grid;place-items:center;font-size:13px;font-variant-numeric:tabular-nums;border:2px solid var(--bg)}
.card .nm{font-family:var(--f-display);font-size:13.5px;line-height:1.1;font-weight:700;padding-left:10px;color:var(--ink)}
.card .ty{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--el);font-weight:700;padding-left:10px}
.artbox{display:block;border-radius:4px;overflow:hidden;margin:1px 0;aspect-ratio:240/140;width:100%}
.art{width:100%;height:100%;display:block}
.artbox.sm{aspect-ratio:auto;height:40px} .artbox.lg{aspect-ratio:240/140}
.card .tx{font-size:11.5px;line-height:1.25;color:#d6d1c5;flex:1}
.card .st{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.card .st .a{color:var(--fire)} .card .st .h{color:var(--good)} .card .st .h.hurt{color:var(--bad)}
.card .x2{position:absolute;top:4px;right:6px;font-size:11px;color:var(--mute);font-weight:700}
.card.manifest{border-color:var(--sapph);border-top-color:var(--el);background:linear-gradient(180deg,color-mix(in srgb,var(--sapph) 12%,var(--raise)),var(--raise) 45%)}
.card.manifest .nm{padding-left:0}
.card.manifest .ty{padding-left:0}
.star{position:absolute;top:3px;right:5px;color:var(--sapph);font-size:15px;line-height:1}
.pips{display:flex;gap:3px;flex-wrap:wrap;margin-right:16px}
.pip{width:11px;height:11px;border-radius:50%;background:var(--el);box-shadow:0 0 6px color-mix(in srgb,var(--el) 60%,transparent)}
.pip.empty{background:transparent;box-shadow:none;border:1.5px solid var(--el)}
.card.playable{outline:2px solid var(--brass);cursor:pointer;transform:translateY(-3px)}
.card.valid{outline:2px dashed var(--good);cursor:crosshair}
.card.sel{outline:2px solid var(--sapph);transform:translateY(-3px)}
.card.dim{opacity:.5}

/* Creatures on the board */
.cr{--crw:118px;--crh:178px;width:var(--crw);height:var(--crh);min-height:0;overflow:hidden;cursor:default;flex:none}
.crslot{--crw:118px;--crh:178px;width:var(--crw);height:var(--crh);display:flex;align-items:center;justify-content:center;transition:width .18s,height .18s}
.crslot.tap{width:var(--crh);height:var(--crw)}
.crslot .cr{transition:transform .12s, rotate .18s}
.crslot.tap .cr{rotate:90deg}
.cr .tag{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--mute)}
.cr .tag.att{color:var(--fire)} .cr .tag.frz{color:var(--water)} .cr .tag.blk{color:var(--sapph)}
.cr.exh{opacity:.62}
.cr.frozen{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--water) 70%,transparent)}
.cr.attacking{transform:translateY(-6px);box-shadow:0 6px 16px rgba(0,0,0,.45)}
.mine .cr.attacking{transform:translateY(-6px)}
.kw{font-size:11px;color:var(--ink);font-weight:700}

/* Combat pairs: an attacker and its blockers share a number and color */
.pc0{--pc:#ff8f5e} .pc1{--pc:#7cc6ff} .pc2{--pc:#c9a0ff} .pc3{--pc:#8fe08f}
.card.paired{box-shadow:0 0 0 2px var(--pc),0 0 16px color-mix(in srgb,var(--pc) 50%,transparent)}
.pair{position:absolute;top:-11px;right:-9px;min-width:26px;height:26px;border-radius:13px;background:var(--pc);color:#121212;font-weight:700;display:grid;place-items:center;font-size:14px;border:2px solid var(--bg);z-index:1}
.cr .tag.blk{color:var(--pc,var(--sapph))}
.bar.in-combat{border-color:var(--fire);box-shadow:0 0 0 1px color-mix(in srgb,var(--fire) 40%,transparent)}
.clash{flex:1 1 100%;display:grid;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.clash-row{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:14px;border-left:4px solid var(--pc);padding:3px 8px;background:color-mix(in srgb,var(--pc) 9%,transparent);border-radius:0 4px 4px 0}
.pair-in{min-width:22px;height:22px;border-radius:11px;background:var(--pc);color:#121212;font-weight:700;display:grid;place-items:center;font-size:12px}
.clash .arrow{color:var(--mute)}
.clash .unb{color:var(--bad);font-weight:700}

/* Game */
.game{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.table{display:grid;gap:10px;min-width:0}
.side{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.side .who{display:flex;flex-direction:column;min-width:120px}
.side .who h2{font-size:19px}
.side.target{outline:2px dashed var(--good);cursor:crosshair}
.life{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--bad);font-variant-numeric:tabular-nums}
.life small{font-size:14px;color:var(--mute);margin-left:2px}
.hp{font-family:var(--f-body,inherit);font-size:11px;font-weight:700;color:var(--bad);margin-left:6px;white-space:nowrap}
.dk-meta{display:flex;gap:8px;align-items:baseline}
.kwt{text-decoration:underline dotted;text-underline-offset:2px;cursor:help;border-radius:3px}
.kwt:hover,.kwt:focus-visible{background:color-mix(in srgb,var(--el,var(--brass)) 22%,transparent);outline:none}
#kwtip{position:fixed;z-index:1000;max-width:260px;padding:8px 10px;border-radius:8px;background:var(--panel,#1b1b22);color:var(--ink);
  border:1px solid color-mix(in srgb,var(--ink) 20%,transparent);box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:12.5px;line-height:1.4;pointer-events:none}
#kwtip b{display:block;margin-bottom:2px}
#kwtip[hidden]{display:none}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:18px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--el);color:var(--el);border-radius:20px;padding:1px 9px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.aura{border:1px solid var(--line);border-left:3px solid var(--el);border-radius:4px;padding:2px 7px;font-size:12px;background:var(--raise)}
.board{min-height:146px;display:flex;flex-wrap:wrap;gap:12px;align-content:center;padding:14px 12px;border-radius:8px;background:repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--line) 25%,transparent) 14px 15px),var(--bg);border:1px dashed var(--line)}
.board .empty{color:var(--mute);font-size:13px;align-self:center}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--brass);border-radius:8px;padding:10px 14px}
.bar .phase{font-family:var(--f-display);font-size:17px}
.bar .prompt{flex:1 1 260px;color:var(--ink);font-size:14px}
.bar .acts{display:flex;gap:8px;flex-wrap:wrap}
.zone{display:grid;gap:8px}
.hand{display:flex;flex-wrap:wrap;gap:14px;padding:12px 6px 4px}
.manis{display:flex;flex-wrap:wrap;gap:14px;padding:12px 6px 4px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:12px;min-width:0;align-self:start}
.insp{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;align-content:start;height:min(470px,52vh);overflow-y:auto;overscroll-behavior:contain}
.fxlayer{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:900;overflow:visible}
.fxlayer path{fill:none;stroke:var(--brass);stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(0,0,0,.6));stroke-dasharray:1200;stroke-dashoffset:1200;animation:fxdraw .45s ease-out forwards}
.fxlayer marker path{fill:var(--brass);stroke:none;animation:none;stroke-dasharray:none}
.fxlayer .fxtgt{fill:none;stroke:var(--brass);stroke-width:3;opacity:0;animation:fxtgt .9s ease-out .3s infinite}
@keyframes fxdraw{to{stroke-dashoffset:0}}
@keyframes fxtgt{0%{opacity:.9;r:14}100%{opacity:0;r:34}}
.fxchip{position:fixed;z-index:901;transform:translate(-50%,-140%);background:var(--brass);color:#1a1408;font-weight:700;font-size:13px;padding:3px 10px;border-radius:12px;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.4);white-space:nowrap}
.fxpop{position:fixed;z-index:902;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:26px;font-weight:700;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.8);animation:fxpop 1.2s ease-out forwards}
.fxpop.fx-dmg{color:var(--bad)} .fxpop.fx-heal{color:var(--good)} .fxpop.fx-frz{color:var(--water);font-size:18px} .fxpop.fx-info{color:var(--ink);font-size:16px}
.fxring{position:fixed;z-index:899;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid var(--bad);pointer-events:none;animation:fxring .6s ease-out forwards}
.fxring.fx-heal{border-color:var(--good)} .fxring.fx-frz{border-color:var(--water)} .fxring.fx-info{border-color:var(--ink)}
@keyframes fxpop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
@keyframes fxring{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(4)}}
@media (prefers-reduced-motion:reduce){.fxlayer path{animation:none;stroke-dashoffset:0}.fxlayer .fxtgt{display:none}.fxpop{animation:fxfade 1.2s linear forwards}.fxring{display:none}}
@keyframes fxfade{0%,70%{opacity:1}100%{opacity:0}}
.insp p{margin:0;font-size:13.5px}
.insp-card{--el:var(--mute);border-left:4px solid var(--el);padding-left:10px;display:grid;gap:6px}
.insp-card h3{font-size:19px;color:var(--el)}
.star-in{color:var(--sapph)}
.insp-meta{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:700}
.insp dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:13.5px}
.insp dt{color:var(--mute)} .insp dd{margin:0;font-variant-numeric:tabular-nums}
.insp-text{background:var(--raise);border-radius:5px;padding:7px 9px;line-height:1.35}
.notice{display:block;margin-top:4px;color:var(--fire);font-size:13px}
.insp-status{display:flex;flex-wrap:wrap;gap:5px}
.insp-status span{font-size:12px;border:1px solid var(--line);border-radius:12px;padding:1px 8px;color:var(--ink)}
.mchip{--el:var(--mute);border:1px solid var(--sapph);border-radius:12px;padding:1px 8px;font-size:12px;color:var(--mute);cursor:help}

/* ---------------- Engine ---------------- */
let g = null;
let uidSeq = 1;
const OVER = { over:true };
const STALE = "stale";

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function deckOf(ref){ return DECK_BY_ID[ref] || DECK_BY_ID[ref+"_starter"]; }
function newPlayer(i, ref, name, isAI, life){
  const dk = deckOf(ref);
  const deck = [];
  dk.main.forEach(id=>{ if (!LIB[id]) throw new Error("Unknown card "+id+" in "+dk.id); deck.push(LIB[id], LIB[id]); });
  return { i, el:dk.el, deckId:dk.id, deckName:dk.name, name, isAI, life, maxLife:life, energy:0, deck:shuffle(deck), hand:[], board:[], auras:[], grave:[],
    manifests: dk.manifests.map(id=>{ if (!LIB[id]) throw new Error("Unknown manifest "+id); return LIB[id]; }), charge:{}, played:0, spent:false, fatigue:0,
    chargeAs: CONFLUENCE[dk.el] ? dk.el : null };
}
function opp(p){ return g.P[1-p.i]; }
function log(s, cls){ if (g.sim) return; g.log.unshift({s, cls}); if(g.log.length>220) g.log.length=220; }

function sleep(ms){
  const id = g.id;
  return new Promise((res, rej)=>setTimeout(()=> g && id===g.id ? res() : rej(STALE), HEADLESS?0:ms));
}

/* ---- Visual cues: targeting arrows and hit numbers (real game only, never in AI lookahead) ---- */
const FX = { q:[] };
const fxOn = () => !HEADLESS && g && !g.sim && typeof document!=="undefined";
const crSel = c => `[data-cr="${c.uid}"]`, lifeSel = p => `.side[data-pl="${p.i}"] .life`, whoSel = p => `.side[data-pl="${p.i}"] .who`;
function fxRect(sel){ const el = document.querySelector(sel); if (!el) return null; const r = el.getBoundingClientRect(); return r.width ? { x:r.left+r.width/2, y:r.top+r.height/2 } : null; }
// Remember where something was hit (before the board re-renders) so a number can pop there.
function fxNote(kind, sel, text){ if (!fxOn()) return; const r = fxRect(sel); if (r) FX.q.push({ kind, sel, r, text }); }
function fxPlay(){
  if (!FX.q.length || typeof document==="undefined") return;
  const q = FX.q; FX.q = [];
  q.forEach((e, i) => setTimeout(() => {
    e.r = fxRect(e.sel) || e.r;      // where it is now (the board may have shifted); a destroyed creature keeps its old spot
    const el = document.createElement("div"); el.className = "fxpop fx-"+e.kind; el.textContent = e.text;
    el.style.left = e.r.x+"px"; el.style.top = e.r.y+"px"; document.body.appendChild(el);
    const ring = document.createElement("div"); ring.className = "fxring fx-"+e.kind; ring.style.left = e.r.x+"px"; ring.style.top = e.r.y+"px"; document.body.appendChild(ring);
    setTimeout(() => { el.remove(); ring.remove(); }, 1300);
  }, i*90));
}
const reduceMotion = () => typeof matchMedia!=="undefined" && matchMedia("(prefers-reduced-motion: reduce)").matches;
// Draw arrows from sources to targets (a label rides along), hold them briefly, then clear.
async function fxArrows(pairs, label, ms){
  if (!fxOn() || !pairs.length) return;
  const pts = pairs.map(([a,b]) => [fxRect(a), fxRect(b)]).filter(([a,b]) => a && b);
  if (!pts.length) return;
  const NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "fxlayer"); svg.setAttribute("aria-hidden", "true");
  svg.innerHTML = `<defs><marker id="fxhead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>`;
  for (const [a,b] of pts){
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2, dx = b.x-a.x, dy = b.y-a.y, len = Math.hypot(dx,dy) || 1;
    const cx = mx - dy/len*Math.min(80, len*0.25), cy = my + dx/len*Math.min(80, len*0.25);
    const path = document.createElementNS(NS, "path"); path.setAttribute("d", `M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}`); path.setAttribute("marker-end", "url(#fxhead)");
    svg.appendChild(path);
    const tgt = document.createElementNS(NS, "circle"); tgt.setAttribute("cx", b.x); tgt.setAttribute("cy", b.y); tgt.setAttribute("r", 26); tgt.setAttribute("class","fxtgt"); svg.appendChild(tgt);
  }
  document.body.appendChild(svg);
  let chip = null;
  if (label){ chip = document.createElement("div"); chip.className = "fxchip"; chip.textContent = label; chip.style.left = pts[0][0].x+"px"; chip.style.top = pts[0][0].y+"px"; document.body.appendChild(chip); }
  try { await sleep(reduceMotion() ? Math.min(ms, 500) : ms); } finally { svg.remove(); chip && chip.remove(); }
}
function onBoard(c){ return g.P[c.owner].board.includes(c); }
function baseKw(c, k){ if (k==="barrier") return !!c.shield; return c.d.kw.includes(k) || (c.kws && c.kws.includes(k)) || (c.tKws && c.tKws.includes(k)); }
function addKw(c, k, temp){ if (!onBoard(c)) return; if (k==="barrier"){ c.shield = true; return; } if (temp) c.tKws = [...(c.tKws||[]), k]; else c.kws = [...(c.kws||[]), k]; }
function stMatch(f, c, src){
  switch (f){
    case "all": return true;
    case "other": return c!==src;
    case "air": return baseKw(c,"airborne") || grantedAir(c);
    case "oair": return c!==src && (baseKw(c,"airborne") || grantedAir(c));
    case "tok": return !!c.d.token;
    default: return true;
  }
}
function grantedAir(c){
  const p = g.P[c.owner];
  for (const a of p.auras) if (a.st) for (const s of a.st) if (s.k==="grant" && s.kw==="airborne" && s.f==="all") return true;
  for (const b of p.board) if (b.d.st) for (const s of b.d.st) if (s.k==="grant" && s.kw==="airborne" && (s.f==="all" || (s.f==="other" && b!==c))) return true;
  return false;
}
function forStatics(p, fn){
  for (const a of p.auras) if (a.st) for (const s of a.st) fn(s, null);
  for (const b of p.board) if (b.d.st) for (const s of b.d.st) fn(s, b);
}
// Hot paths for the AI's simulations: plain loops instead of callbacks.
function hasKw(c, k){
  if (baseKw(c,k)) return true;
  const p = g.P[c.owner];
  for (const a of p.auras){ const st = a.st; if (st) for (const s of st) if (s.k==="grant" && s.kw===k && stMatch(s.f, c, null)) return true; }
  for (const b of p.board){ const st = b.d.st; if (st) for (const s of st) if (s.k==="grant" && s.kw===k && stMatch(s.f, c, b)) return true; }
  return false;
}
function statSum(c, key){
  let n = 0; const p = g.P[c.owner];
  for (const a of p.auras){ const st = a.st; if (st) for (const s of st) if (s.k==="lord" && s[key] && stMatch(s.f, c, null)) n += s[key]; }
  for (const b of p.board){ const st = b.d.st; if (st) for (const s of st) if (s.k==="lord" && s[key] && stMatch(s.f, c, b)) n += s[key]; }
  return n;
}
function atkOf(c){ return Math.max(0, c.atk + c.tAtk + statSum(c,"atk")); }
function hpOf(c){ return c.hp + c.tHp + statSum(c,"hp"); }
function hpLeft(c){ return hpOf(c) - c.dmg; }
function isDead(c){ return c.dmg >= hpOf(c); }
function boardPower(p){ return p.board.reduce((s,c)=>s+atkOf(c)+hpOf(c),0); }
function bankCap(p){ let n = 3; forStatics(p, s=>{ if (s.k==="bank") n += s.n; }); return n; }

function costOf(cardDef, p){
  let c = cardDef.cost;
  forStatics(p, s=>{ if (s.k==="cost" && s.type===cardDef.type) c -= s.n; });
  if (cardDef.id==="galvanic_golem" || (cardDef.fused && cardDef.fused.includes("galvanic_golem"))) return Math.max(1, c - p.played);
  return Math.max(0,c);
}

// Reactive triggers (life gain, draws, enemy damage...) can't set off further reactive triggers.
let REACT_DEPTH = 0;
function react(p, evt, data){ if (REACT_DEPTH>0 || !g) return; REACT_DEPTH++; try { hook(p, evt, data||{}); } finally { REACT_DEPTH--; } }
function dmgPlayer(p, n, src){
  if (n<=0) return;
  fxNote("dmg", lifeSel(p), "−"+n);
  p.life -= n;
  log(`${src ? src+": " : ""}${p.name} ${p.isAI?"takes":"take"} ${n} damage.`, "dmg");
  react(opp(p), "face", {n, x:n});
}
function dmgCreature(c, n){
  if (n<=0) return 0;
  if (c.shield){ c.shield = false; log(`${c.d.name}'s Barrier breaks.`); fxNote("info", crSel(c), "Barrier"); return 0; }
  fxNote("dmg", crSel(c), "−"+n);
  c.dmg += n;
  if (c.d.onHurt && onBoard(c) && REACT_DEPTH===0){ REACT_DEPTH++; try { c.d.onHurt({p:g.P[c.owner], o:opp(g.P[c.owner]), self:c, data:{n, x:n}}); } finally { REACT_DEPTH--; } }
  return n;
}
function dmgT(t, n){
  if (!t) return;
  if (t.kind==="player") dmgPlayer(t.p, n);
  else if (onBoard(t.c)) { dmgCreature(t.c, n); log(`${t.c.d.name} takes ${n} damage.`); }
}
function heal(p, n){ if (n<=0) return; fxNote("heal", lifeSel(p), "+"+n); p.life = Math.min(p.maxLife, p.life+n); log(`${p.name} ${p.isAI?"gains":"gain"} ${n} life.`); react(p, "heal", {n, x:n}); }
// A confluence deck has a single charge type: every charge it gains or spends is that confluence's.
function chEl(p, el){ return p.chargeAs || el; }
function gainCharge(p, el, n){ if(n<=0) return; el = chEl(p, el); p.charge[el] = (p.charge[el]||0) + n; react(p, "charge", {n, x:n}); }
function gainEnergy(p, n){ p.energy += n; }
function spendCharge(p, el, n){
  el = chEl(p, el);
  if (n<=0) return;
  p.charge[el] -= n; p.spent = true;
  hook(p, "spend", {n});
}
function drawN(p, n){
  for (let i=0;i<n;i++){
    if (!p.deck.length){ p.fatigue++; dmgPlayer(p, p.fatigue, "Empty deck"); continue; }
    p.hand.push(p.deck.pop());
    react(p, "draw", {});
  }
}
function makeCreature(d, p){
  return { uid: uidSeq++, d, owner:p.i, atk:d.atk, hp:d.hp, dmg:0, tAtk:0, tHp:0, tKws:null, kws:null,
    sick: !d.kw.includes("haste"), exhausted:false, frozen:false, attacking:false, noBlock:false, shield: d.kw.includes("barrier") };
}
const BOARD_MAX = 8;   // creatures per side
function summon(p, d){ if (p.board.length>=BOARD_MAX) return null; const c = makeCreature(d,p); p.board.push(c); if (d.token) react(p, "token", {c}); return c; }
function buff(c, a, h, temp){ if(!onBoard(c)) return; if(temp){ c.tAtk+=a; c.tHp+=h; } else { c.atk+=a; c.hp+=h; } }
function freeze(c){
  if (!onBoard(c)) return;
  c.exhausted = true; c.frozen = true; fxNote("frz", crSel(c), "Frozen");
  if (c.attacking){ c.attacking=false; log(`${c.d.name} is frozen out of combat.`); }
  else log(`${c.d.name} is frozen.`);
  react(opp(g.P[c.owner]), "freeze", {c});
}
function bounce(c){
  if (!onBoard(c)) return;
  const owner = g.P[c.owner];
  fxNote("info", crSel(c), "Returned");
  owner.board.splice(owner.board.indexOf(c),1);
  c.attacking = false;
  if (c.d.token){ log(`${c.d.name} fades away.`); return; }
  owner.hand.push(c.d);
  log(`${c.d.name} returns to ${owner.isAI?"the enemy's":"your"} hand.`);
  react(opp(owner), "ebounce", {c});
}
function hook(p, evt, data={}){
  const o = opp(p);
  for (const c of [...p.board]){ const h=c.d.on && c.d.on[evt]; if(h && data.inst!==c && onBoard(c)) h({p,o,self:c,data}); }
  for (const a of [...p.auras]){ const h=a.on && a.on[evt]; if(h) h({p,o,self:a,data}); }
}
function checkDeaths(){
  let again = true;
  while (again){
    again = false;
    for (const p of g.P){
      for (const c of [...p.board]){
        if (isDead(c)){
          p.board.splice(p.board.indexOf(c),1);
          if (!c.d.token) p.grave.push(c.d);
          log(`${c.d.name} is destroyed.`);
          const x = Math.max(0, c.atk + c.tAtk);
          if (c.d.death){ c.d.death({p,o:opp(p),self:c, data:{x}}); again = true; }
          hook(p, "die", {x, d:c.d}); hook(opp(p), "edie", {x, d:c.d}); again = true;
        }
      }
    }
  }
  checkWin();
}
/* Boss phases (design/bosses.md, approved 2026-10-24). A boss is a player with p.boss = { bars:[8,8], slowStart, clearOnBreak, breakHeal }.
   At 0 life with a bar left it refills to the next bar instead of losing; its creatures can leave play (no Last Gasp);
   the other side may heal and draw. p.boss is shared by AI look-ahead clones and never mutated; p.phase counts from 1. */
const bossPhases = p => p.boss ? p.boss.bars.length + 1 : 1;
function bossEnergyMod(p){
  const b = p.boss; if (!b) return 0;
  if (b.energyByPhase) return (b.energyByPhase[Math.min(p.phase, b.energyByPhase.length) - 1] || 3) - 3;
  return b.slowStart && p.phase === 1 ? -1 : 0;
}
function bossBreaks(){
  for (const q of g.P){
    if (q.life > 0 || !q.boss || q.phase >= bossPhases(q)) continue;
    q.life = q.maxLife = q.boss.bars[q.phase - 1]; q.phase++;
    if (q.boss.clearOnBreak){ for (const c of q.board) if (!c.d.token && !c.d.manifest) q.grave.push(c.d); q.board.length = 0; }
    const o = g.P[1-q.i];
    if (q.boss.breakHeal && o.life > 0){ o.life = Math.min(o.maxLife, o.life + q.boss.breakHeal); drawN(o, 1); }
    if (!g.sim){ log(`${q.name} is broken but rises: phase ${q.phase} of ${bossPhases(q)}!`, "big"); g.phaseFlash = { who:q.name, phase:q.phase, of:bossPhases(q) }; if (globalThis.onBossPhase) onBossPhase(q); }
  }
}
function checkWin(){
  bossBreaks();
  const [a,b] = g.P;
  if (a.life<=0 || b.life<=0){
    g.over = a.life<=0 && b.life<=0 ? "draw" : (a.life<=0 ? "enemy" : "you");
    throw OVER;
  }
}

// Targeted cards can pick any creature on either side (Ward only stops the enemy's cards).
// The spec type keeps the card's intent (hostile or friendly) for AI defaults and fused auto-targets.
function targetsFor(spec, p, intentOnly){
  const o = opp(p);
  const legal = c => !(hasKw(c,"ward") && c.owner!==p.i);
  const side = intentOnly ? (HOSTILE[spec.type] ? [o] : [p]) : [p, o];
  const crs = side.flatMap(pl => pl.board).filter(legal).map(c=>({kind:"creature", c}));
  let out = [];
  switch (spec.type){
    case "enemyAny": out = [...crs, {kind:"player", p:o}]; break;
    case "enemyCreature": case "ownCreature": out = crs; break;
    case "ownAttacker": case "enemyAttacker": out = crs.filter(t=>t.c.attacking); break;
  }
  if (spec.filter) out = out.filter(spec.filter);
  return out;
}
function targetStillValid(t){ return !t || t.kind==="player" || onBoard(t.c); }
function canOC(p, d){ return !!d.oc && (p.charge[chEl(p, d.el)]||0) >= d.oc.cost; }
function needsTargetPick(p, d){
  if (!d.target) return false;
  if (d.target.ocOnly && !canOC(p,d)) return false;
  return true;
}
function targetRequired(d){ return d.target && d.type!=="creature" && !d.target.optional; }
function canPlayNow(p, d, win){
  if (costOf(d,p) > p.energy) return false;
  if (d.type==="creature" && p.board.length>=BOARD_MAX) return false;
  if (d.counter) return win==="respond";
  if (win!=="main" && d.type!=="reaction") return false;
  if (targetRequired(d) && !targetsFor(d.target,p).length) return false;
  return true;
}
// Why a card can't be played right now (null when it can).
const TARGET_NEEDS = { enemyAny:"a creature or the enemy", enemyCreature:"a creature (enemy creatures with Ward can't be targeted)", ownCreature:"a creature", ownAttacker:"an attacking creature", enemyAttacker:"an attacking creature" };
function whyNotPlayable(p, d, win){
  if (d.manifest){
    const short = Object.entries(d.mcost).filter(([el,n])=>(p.charge[el]||0)<n).map(([el,n])=>`${n} ${ELS[el]} charge (you have ${p.charge[el]||0})`);
    if (short.length) return `Needs ${short.join(" and ")}.`;
  } else {
    if (costOf(d,p) > p.energy) return `Costs ${costOf(d,p)} Energy; you have ${p.energy}.`;
    if (d.type==="creature" && p.board.length>=BOARD_MAX) return `Your side is full (${BOARD_MAX} creatures).`;
    if (d.counter) return "A counter: you can only play it when the enemy casts a card.";
    if (win!=="main" && d.type!=="reaction") return "Only Reactions can be played right now.";
  }
  if (targetRequired(d) && !targetsFor(d.target,p).length) return `No legal target: it needs ${TARGET_NEEDS[d.target.type]||"a target"}${d.target.filter?" that matches its condition":""}.`;
  return null;
}
function canAffordManifest(p, m){ return Object.entries(m.mcost).every(([el,n])=>(p.charge[el]||0)>=n); }
function canCastManifest(p, m){
  if (!canAffordManifest(p,m)) return false;
  if (m.type==="creature" && p.board.length>=BOARD_MAX) return false;
  if (targetRequired(m) && !targetsFor(m.target,p).length) return false;
  return true;
}
function canAttack(c){ return !c.exhausted && (!c.sick || hasKw(c,"haste")) && !hasKw(c,"wall"); }
function canBlock(b, a){ return !b.exhausted && !b.noBlock && (!hasKw(a,"airborne") || hasKw(b,"airborne") || hasKw(b,"skyguard")); }

function resolveCard(p, d, t, oc){
  const o = opp(p);
  if (!targetStillValid(t)) t = null;
  const x = { p, o, t, oc, chain:p.played, card:d };
  if (d.type==="creature"){
    const c = makeCreature(d,p); p.board.push(c); x.self = c;
    if (d.play) d.play(x);
    afterPlay(p, d, c);
  } else if (d.type==="aura"){
    p.auras.push(d);
    if (d.play) d.play(x);
    afterPlay(p, d, null);
  } else {
    if (targetRequired(d) && !t){ log(`${d.name} has no target and fizzles.`); }
    else if (d.play) d.play(x);
    if (!d.manifest) p.grave.push(d);
    afterPlay(p, d, null);
  }
  if (d.manifest) hook(p, "manifest", {card:d});
  checkDeaths();
}
function afterPlay(p, d, inst){
  if (!d.manifest) gainCharge(p, d.el, d.charge);
  p.played++;
  if (d.type==="spell" || d.type==="reaction") p.spells = (p.spells||0) + 1;
  if (d.manifest) p.maniCast = (p.maniCast||0) + 1;
  hook(p, "played", {card:d, inst});
}

async function castCard(p, hi, t, oc){
  const d = p.hand[hi];
  p.energy -= costOf(d,p);
  p.hand.splice(hi,1);
  log(`${p.name} ${p.isAI?"plays":"play"} ${d.name}${oc?" (Overcharged)":""}.`);
  render();
  if (await counterCheck(opp(p), d, t, oc)){ p.grave.push(d); render(); return; }
  if (oc && canOC(p,d)) spendCharge(p, d.el, d.oc.cost); else oc = false;
  if (t) await fxArrows([[whoSel(p), t.kind==="player" ? lifeSel(t.p) : crSel(t.c)]], d.name, p.isAI ? 900 : 350);
  resolveCard(p, d, t, oc);
  render();
}
async function castManifest(p, mi, t){
  const m = p.manifests[mi];
  p.manifests.splice(mi,1);
  for (const [el,n] of Object.entries(m.mcost)) spendCharge(p, el, n);
  log(`${p.name} ${p.isAI?"casts":"cast"} the Manifest ${m.name}!`, "big");
  if (!HEADLESS){ g.inspect = { def:m, where:(p.isAI?"Enemy":"Your")+" Manifest" }; g.flash = { m, who:p.isAI?"The enemy casts a Manifest":"You cast a Manifest" }; onManifestCast(p, m); render(); await sleep(p.isAI?1900:1100); g.flash = null; }
  if (t) await fxArrows([[whoSel(p), t.kind==="player" ? lifeSel(t.p) : crSel(t.c)]], m.name, p.isAI ? 900 : 350);
  resolveCard(p, m, t, false);
  render();
}
async function counterCheck(o, d, t, oc){
  if (o.isAI){ const hi = aiShouldCounter(o, d, t, oc); return hi>=0 ? doCounter(o, hi, d) : false; }
  while (true){
    const opts = o.hand.map((c,i)=>i).filter(i=>canPlayNow(o,o.hand[i],"respond") && (!o.hand[i].counter || counterOK(o.hand[i], d)));
    if (!opts.length) return false;
    g.inspect = { def:d, where:"Enemy card being cast" };
    const v = await waitUI("respond", { text:`The enemy is casting ${d.name}. You can respond with a Reaction before it resolves.`, card:d, options:opts });
    if (typeof v !== "number") return false;
    if (o.hand[v].counter) return doCounter(o, v, d);
    await humanCast(o, v, "respond");
  }
}
function counterOK(c, d){ return !c.counterIf || c.counterIf(d); }
function doCounter(o, pick, d){
  const c = o.hand[pick];
  o.energy -= costOf(c,o);
  o.hand.splice(pick,1);
  o.grave.push(c);
  log(`${o.name} ${o.isAI?"counters":"counter"} ${d.name} with ${c.name}. It gives no charge.`, "big");
  if (c.afterCounter) c.afterCounter({p:o, o:opp(o)});
  afterPlay(o, c, null);
  checkDeaths();
  return true;
}

/* Combat */
async function runCombat(ap, attackers){
  if (!attackers.length) return;
  const dp = opp(ap);
  log(`${ap.name} ${ap.isAI?"attacks":"attack"} with ${attackers.map(c=>c.d.name).join(", ")}.`);
  declareAttack(ap, attackers);
  render();
  await fxArrows(attackers.filter(onBoard).map(c=>[crSel(c), lifeSel(dp)]), null, ap.isAI ? 900 : 300);
  if (dp.isAI) applyBlocks(aiDefend(dp));
  else {
    const eligible = dp.board.some(b=>attackers.some(a=>canBlock(b,a)));
    if (!eligible){ log("You have no creatures that can block."); render(); await sleep(1100); }
    if (eligible){
      const assign = await waitUI("block", { assign:new Map(), sel:null });
      for (const [bu, au] of assign){
        const b = dp.board.find(c=>c.uid===bu), a = attackers.find(c=>c.uid===au);
        if (!b || !a) continue;
        if (!g.combat.blocks.has(a.uid)) g.combat.blocks.set(a.uid, []);
        g.combat.blocks.get(a.uid).push(b);
      }
    }
  }
  for (const [au, bl] of g.combat.blocks){
    const a = attackers.find(c=>c.uid===au);
    log(`${bl.map(b=>b.d.name).join(" and ")} ${bl.length>1?"block":"blocks"} ${a.d.name}.`);
  }
  blockTriggers(dp);
  render();
  { const bp = []; for (const [au, bl] of g.combat.blocks) for (const b of bl) bp.push([crSel(b), `[data-cr="${au}"]`]); await fxArrows(bp, null, dp.isAI ? 900 : 300); }
  if (dp.isAI) await aiCombatReact(dp); else await reactionWindow(dp, "Blocks are set. You can play Reactions, or let damage happen.");
  if (ap.isAI) await aiCombatReact(ap); else await reactionWindow(ap, g.combat.blocks.size ? "The enemy has chosen its blocks (shown below)." : "The enemy didn't block.", true);
  resolveCombat(ap);
}
function declareAttack(ap, attackers){
  attackers.forEach(c=>{ c.attacking=true; c.exhausted = !hasKw(c,"vigilant"); });
  g.combat = { att: attackers, blocks: new Map() };
  const o = opp(ap);
  for (const c of attackers) if (c.d.onAttack && onBoard(c)) c.d.onAttack({p:ap, o, self:c});
  checkDeaths();
}
function blockTriggers(dp){
  if (!g.combat) return;
  const o = opp(dp);
  for (const bl of g.combat.blocks.values()) for (const b of bl) if (b.d.onBlock && onBoard(b)) b.d.onBlock({p:dp, o, self:b});
  checkDeaths();
}
function resolveCombat(ap){
  const dp = opp(ap);
  const pending = new Map(), drains = [], venom = new Set();
  const add = (c,n,src)=>{ pending.set(c,(pending.get(c)||0)+n); if (n>0 && hasKw(src,"venom")) venom.add(c); };
  for (const a of g.combat.att){
    if (!onBoard(a) || !a.attacking) continue;
    const bl = (g.combat.blocks.get(a.uid)||[]).filter(b=>onBoard(b));
    const atk = atkOf(a);
    if (!bl.length){ dmgPlayer(dp, atk, a.d.name); if (hasKw(a,"drain")) drains.push([ap,atk]); continue; }
    let rem = atk;
    bl.forEach((b,idx)=>{
      const last = idx===bl.length-1;
      const give = last && !hasKw(a,"pierce") ? rem : Math.min(rem, Math.max(0,hpLeft(b)));
      add(b, give, a); rem -= give;
      add(a, atkOf(b), b);
      if (hasKw(b,"drain") && atkOf(b)>0) drains.push([dp, atkOf(b)]);
    });
    if (rem>0 && hasKw(a,"pierce")) dmgPlayer(dp, rem, `${a.d.name} (Pierce)`);
    if (hasKw(a,"drain") && atk>0) drains.push([ap, atk]);
  }
  for (const [pl,n] of drains) heal(pl, n);
  for (const [c,n] of pending){ const hit = dmgCreature(c,n); if (hit && venom.has(c) && onBoard(c)){ c.dmg = Math.max(c.dmg, hpOf(c)); log(`Venom destroys ${c.d.name}.`); } }
  g.combat.att.forEach(c=>c.attacking=false);
  g.combat = null;
  checkDeaths();
  render();
}

/* Turn flow */
function startTurn(p){
  g.P.forEach(q=>{ q.played=0; q.spent=false; q.spells=0; });
  p.energy += 3 + bossEnergyMod(p);
  for (const c of p.board){
    if (c.frozen){ c.frozen=false; c.exhausted=true; } else c.exhausted=false;
    c.sick = false;
    const fo = (c.d.fort||0) + (c.fortB||0); if (fo){ c.atk += fo; c.hp += fo; }
  }
  log(`Turn ${g.turnNo}: ${p.isAI?"Enemy":"You"} (${p.energy} Energy)`, "turn");
  hook(p, "start");
  checkDeaths();
  if (g.turnNo>1) drawN(p,1);
  checkWin();
}
function endTurn(p){
  hook(p, "end"); checkDeaths();
  for (const q of g.P) for (const c of q.board){ c.dmg=0; c.tAtk=0; c.tHp=0; c.tKws=null; c.noBlock=false; }
  while (p.hand.length>7){ const d=p.hand.pop(); p.grave.push(d); log(`${p.name} ${p.isAI?"discards":"discard"} ${d.name} (hand limit).`); }
  const cap = bankCap(p);
  if (p.energy>cap) p.energy = cap;
}
async function runGame(){
  try {
    if (!HEADLESS && g.coin){ render(); await sleep(reduceMotion() ? 1200 : 2000); g.coin = null; }
    while (true){
      const p = g.P[g.active];
      g.turnNo++;
      startTurn(p);
      render();
      if (p.isAI) await aiTurn(p); else await humanTurn(p);
      endTurn(p);
      const o = opp(p);
      if (o.isAI){ g.phase = "end"; await aiInstantWindow(o); }
      g.active = 1-g.active;
    }
  } catch(e){
    if (e===STALE) return;
    if (e===OVER){ log(g.over==="you"?"Victory!":g.over==="enemy"?"Defeat.":"Draw.", "big"); g.ui={mode:"idle"}; render(); return g.over; }
    console.error(e); if(g) { log("Engine error: "+(e && e.message), "dmg"); render(); }
    throw e;
  }
}

/* Human input via promises */
function waitUI(mode, data){
  if (HEADLESS) throw new Error("waitUI in headless");
  return new Promise(res=>{ g.ui = Object.assign({mode, res}, data); render(); });
}
function finishUI(v){ const r=g.ui.res; g.ui={mode:"idle"}; g.notice=null; r && r(v); render(); }

async function humanTurn(p){
  await humanMain(p, "main1");
  const elig = p.board.filter(canAttack);
  if (elig.length){
    g.phase = "combat";
    const att = await waitUI("attack", { sel:new Set() });
    await runCombat(p, p.board.filter(c=>att.includes(c.uid)));
  }
  await humanMain(p, "main2");
}
async function humanMain(p, phase){
  g.phase = phase;
  while (true){
    const v = await waitUI("main", {});
    if (v==="next") return;
    if (v.hand!=null) await humanCast(p, v.hand, "main");
    else if (v.man!=null) await humanManifest(p, v.man);
  }
}
async function reactionWindow(p, label, force){
  if (!force && !p.hand.some(d=>canPlayNow(p,d,"instant"))) return;
  while (true){
    const v = await waitUI("react", { label });
    if (v==="done") return;
    await humanCast(p, v, "instant");
    if (!force && !p.hand.some(d=>canPlayNow(p,d,"instant"))) return;
  }
}
async function pickTarget(p, d){
  const valid = targetsFor(d.target,p);
  const optional = d.type==="creature" || !!d.target.optional;
  if (!valid.length) return optional ? null : "cancel";
  const t = await waitUI("target", { valid, optional, name:d.name });
  return t==="skip" ? null : t;
}
async function humanCast(p, hi, win){
  const d = p.hand[hi];
  if (!d || !canPlayNow(p,d,win)) return;
  let t = null;
  if (needsTargetPick(p,d)){ t = await pickTarget(p,d); if (t==="cancel") return; }
  let oc = false;
  if (canOC(p,d) && !(d.target && d.target.ocOnly && !t)){
    oc = await waitUI("confirm", { title:`Overcharge ${d.name}?`, text:`Spend ${d.oc.cost} ${ELS[chEl(p,d.el)]} charge to ${d.oc.text}. You have ${p.charge[d.el]}.`, yes:"Overcharge", no:"Play normally" });
  }
  await castCard(p, p.hand.indexOf(d), t, oc);
}
async function humanManifest(p, mi){
  const m = p.manifests[mi];
  if (!m || !canCastManifest(p,m)) return;
  let t = null;
  if (m.target){ t = await pickTarget(p,m); if (t==="cancel") return; }
  await castManifest(p, p.manifests.indexOf(m), t);
}

/* ---------------- AI ----------------
   Five difficulty levels:
   1 Novice      random legal plays, never casts Manifests
   2 Apprentice  plays the best move one at a time, simple attack and block rules, no look-ahead
   3 Adept       sequences its hand two plays deep and weighs next-turn threats; quick combat checks
   4 Strategist  full combat look-ahead, exhaustive blocking, end-of-turn Reactions, plus deck and matchup strategy
   5 Master      Strategist plus it cheats: sees your hand and draw order and plays out your whole next turn
   Levels 1-4 never look at hidden cards: their simulations shuffle unknown decks. */
const AI_LEVELS = {
  1:{ name:"Novice",     desc:"Plays random legal cards and never casts Manifests." },
  2:{ name:"Apprentice", desc:"Spends its resources and casts Manifests, but only thinks one move at a time." },
  3:{ name:"Adept",      desc:"Plans its hand a couple of plays ahead and watches for your threats." },
  4:{ name:"Strategist", desc:"Full combat look-ahead plus knowledge of both decks: plans a race or a defense around the matchup." },
  5:{ name:"Master",     desc:"Cheats: sees your hand and your draw order and plays out your next turn before choosing." }
};
const AIW = { life:1.2, lowLife:1.6, hand:1.6, energy:0.55, reactHold:1.8, charge:0.9, chargeExtra:0.25,
  maniOpt:1.5, maniProg:2.2, aura:4, maniAura:3.3, danger:0.45, lethal:30, pressure:0.2,
  atk:1, hp:0.65, air:0.35, engine:2.5, fort:2.2, oppScale:1 };
const AIW2 = { ...AIW, danger:0, lethal:0, pressure:0, reactHold:0, noThreat:true };
function levelOf(p){ return p.level || 3; }
const L5OPT = { deep:true, burn:true, counter:true, trick:true, turns:3, k:4, blocks:true, strongOpp:true, avgH:true, mix:"avg" };
let AI_HIDE = false;          // set per decision: hide unknown cards from levels 1-4
function aiCtx(p){ if (!g.sim) AI_HIDE = levelOf(p) < 5; }
const rnd = a => a[Math.floor(Math.random()*a.length)];

function findCr(uid){ for (const p of g.P) for (const c of p.board) if (c.uid===uid) return c; return null; }
function refT(t){ return !t ? null : t.kind==="player" ? {kind:"player", pi:t.p.i} : {kind:"creature", uid:t.c.uid}; }
function liveT(r){ if (!r) return null; if (r.kind==="player") return {kind:"player", p:g.P[r.pi]}; const c=findCr(r.uid); return c ? {kind:"creature", c} : null; }
function cloneState(src){
  const map = new Map();
  const cc = c => { let n = map.get(c); if (!n){ n = {...c}; map.set(c,n); } return n; };
  const hide = AI_HIDE && !src.sim;
  const P = src.P.map(p=>({...p, deck: hide ? shuffle([...p.deck]) : [...p.deck], hand:[...p.hand], board:p.board.map(cc), auras:[...p.auras], grave:[...p.grave], manifests:[...p.manifests], charge:{...p.charge}}));
  const combat = src.combat ? { att:src.combat.att.map(cc), blocks:new Map([...src.combat.blocks].map(([k,v])=>[k, v.map(cc)])) } : null;
  return {...src, P, combat, log:[], sim:true, ui:{mode:"idle"}, flash:null};
}
function simulate(fn, pi){
  const saved = g; g = cloneState(saved);
  let v;
  try { fn(); v = evalState(pi); }
  catch(e){ if (e!==OVER){ g = saved; throw e; } v = evalState(pi); }
  g = saved;
  return v;
}
function sumObj(o){ let s=0; for (const k in o) s+=o[k]; return s; }
function crVal(c, W){
  const d = c.d;
  if (hasKw(c,"wall")) return 0.8 + (hpOf(c)-c.tHp)*0.6 + (d.onBlock?1.5:0) + (d.on||d.st?W.engine:0);
  const a = atkOf(c) - c.tAtk, h = hpOf(c) - c.tHp;
  let v = 0.8 + a*W.atk + h*W.hp;
  if (hasKw(c,"airborne")) v += a*W.air + (W.airBonus||0);
  if (d.kw.includes("pierce")) v += a*0.15;
  if (d.fort || c.fortB) v += ((d.fort||0)+(c.fortB||0))*W.fort;
  if (d.on) v += W.engine;
  if (d.st) v += W.engine*0.8;
  if (d.onAttack || d.onBlock) v += 1.5;
  if (hasKw(c,"ward")) v += 0.8;
  if (hasKw(c,"drain")) v += a*0.3;
  if (hasKw(c,"skyguard")) v += 0.5 + (W.airBonus||0);
  if (hasKw(c,"vigilant")) v += a*0.3;
  if (d.death) v += 1.2;
  if (c.frozen) v -= a*0.5;
  return v;
}
function sideVal(p, W){
  const l = p.life, low = W.lowAt || 6;
  let v = l*W.life - (l<low ? (low-l)*W.lowLife : 0);
  for (const c of p.board) v += crVal(c, W);
  for (const a of p.auras) v += a.manifest ? W.maniAura : W.aura;
  v += p.hand.length*W.hand;
  const keep = Math.min(p.energy, bankCap(p));
  v += keep*W.energy;
  let cheap = 99; for (const d of p.hand) if (d.type==="reaction") cheap = Math.min(cheap, costOf(d,p));
  if (keep>=cheap) v += W.reactHold;
  const need = {};
  for (const m of p.manifests) for (const el in m.mcost) need[el] = Math.max(need[el]||0, m.mcost[el]);
  for (const el in p.charge){ const n = p.charge[el], u = Math.min(n, need[el]||0); v += u*W.charge + (n-u)*W.chargeExtra; }
  for (const m of p.manifests){
    let have = 0; for (const el in m.mcost) have += Math.min(p.charge[el]||0, m.mcost[el]);
    v += W.maniOpt + W.maniProg*Math.pow(have/sumObj(m.mcost), 2);
  }
  return v;
}
// Damage `att` can expect to push through on its next attack against `def`.
function threat(att, def){
  const A = att.board.filter(c=>!hasKw(c,"wall") && !c.frozen && atkOf(c)-c.tAtk>0).map(c=>({a:atkOf(c)-c.tAtk, air:hasKw(c,"airborne")})).sort((x,y)=>y.a-x.a);
  const B = def.board.filter(c=> g.active===def.i ? !c.exhausted : !c.frozen);
  const used = new Array(A.length).fill(false);
  for (const b of B){
    const air = hasKw(b,"airborne") || hasKw(b,"skyguard");
    const i = A.findIndex((x,j)=>!used[j] && (!x.air || air));
    if (i>=0) used[i] = true;
  }
  let inc = 0; A.forEach((x,j)=>{ if (!used[j]) inc += x.a; });
  for (const a of att.auras) if (a.id==="heart_of_sun") inc += 2;
  return inc;
}
// Level 5 only: face damage the opponent can deal from the cards actually in their hand next turn.
function handBurn(p){
  const energy = Math.min(p.energy, bankCap(p)) + 3;
  let dmg = 0, spent = 0;
  const opts = p.hand.map(d=>({d, c:d.cost, v:(d.burn||0) + (d.kw.includes("haste") ? (d.atk||0) : 0)})).filter(x=>x.v>0).sort((a,b)=>b.v/Math.max(1,b.c)-a.v/Math.max(1,a.c));
  for (const x of opts) if (spent + x.c <= energy){ spent += x.c; dmg += x.v; }
  return dmg;
}
function evalState(pi){
  if (g.hAvg!=null && !g.over){ const h = g.hAvg; g.hAvg = null; const v = evalState(pi); g.hAvg = h; return (v + 2*h)/3; }
  // A lost position still prefers losing by less, so the AI keeps blocking when an attack is lethal anyway.
  if (g.over){ if (g.over==="draw") return -500; return ((g.over==="you")===(pi===0)) ? 10000 - g.turnNo : -10000 + g.turnNo + Math.max(-40, g.P[pi].life)*3; }
  const me = g.P[pi], op = g.P[1-pi], W = me.aiW || AIW;
  let v = sideVal(me, W) - W.oppScale*sideVal(op, W);
  if (!W.noThreat){
    let t = threat(op, me);
    if (W.cheat && L5OPT.burn) t += handBurn(op);
    v -= (t>=me.life ? W.lethal + t*0.5 : t*W.danger) * (g.active===pi ? 1 : 0.6);
    const t2 = threat(me, op);
    v += (t2>=op.life ? 8 : t2*W.pressure);
  }
  if (W.sweepRisk && me.board.length>3) v -= (me.board.length-3) * W.sweepRisk;
  if (g.active===pi && g.phase==="main1" && !g.combat && !g.lookAhead){
    const blockers = op.board.filter(b=>!b.exhausted && !b.noBlock);
    for (const c of me.board) if (canAttack(c) && atkOf(c)>0) v += atkOf(c) * (blockers.some(b=>canBlock(b,c)) ? 0.15 : 0.75);
  }
  return v;
}
function genActions(p, win){
  const acts = [], seen = new Set();
  p.hand.forEach((d,hi)=>{
    if (seen.has(d.id) || d.counter || !canPlayNow(p,d,win)) return;
    seen.add(d.id);
    let tl = [null];
    if (d.target){
      const ts = targetsFor(d.target,p).map(refT);
      tl = (d.type==="creature" || d.target.optional || d.target.ocOnly) ? [null, ...ts] : ts;
      if (!tl.length) return;
    }
    const ocs = canOC(p,d) ? [false,true] : [false];
    for (const t of tl) for (const oc of ocs){
      if (d.target && d.target.ocOnly && (!!t)!==oc) continue;
      acts.push({kind:"card", hi, t, oc});
    }
  });
  if (win==="main" && levelOf(p)>=2) p.manifests.forEach((m,mi)=>{
    if (!canCastManifest(p,m)) return;
    let tl = [null];
    if (m.target){ tl = targetsFor(m.target,p).map(refT); if (!tl.length) return; }
    for (const t of tl) acts.push({kind:"man", mi, t});
  });
  return acts;
}
function applyAction(pi, a){
  const p = g.P[pi];
  if (a.kind==="card"){
    const d = p.hand[a.hi];
    p.energy -= costOf(d,p); p.hand.splice(a.hi,1);
    const oc = a.oc && canOC(p,d); if (oc) spendCharge(p, d.el, d.oc.cost);
    resolveCard(p, d, liveT(a.t), oc);
  } else {
    const m = p.manifests[a.mi]; p.manifests.splice(a.mi,1);
    for (const el in m.mcost) spendCharge(p, el, m.mcost[el]);
    resolveCard(p, m, liveT(a.t), false);
  }
}
const finishCombat = ()=>{ if (g.combat) resolveCombat(g.P[g.active]); };

/* ---- strategy layer (levels 4-5) ---- */
function deckProfile(p){
  const cards = [...p.deck, ...p.hand, ...p.grave, ...p.manifests, ...p.board.map(c=>c.d)];
  const all = cards.length || 1;
  let cheap=0, haste=0, burn=0, sweep=0, fliers=0, antiAir=0, heal=0, counters=0, removal=0, bigHp=0, creatures=0;
  for (const d of cards){
    const t = (d.text||"").toLowerCase();
    if (d.type==="creature"){ creatures++; if (d.cost<=2 && !d.manifest) cheap++; if (d.kw.includes("haste")) haste++; if (d.kw.includes("airborne")){ fliers++; antiAir++; } if (d.kw.includes("skyguard")) antiAir++; if ((d.hp||0)>=6) bigHp++; }
    if (/to the enemy\b/.test(t)) burn++;
    if (/every enemy (basic )?creature/.test(t) || t.includes("every creature")) sweep++;
    if (t.includes("gain") && t.includes("life")) heal++;
    if (d.counter) counters++;
    if (/(damage to an enemy creature|destroy an|freeze an|return an enemy)/.test(t)) removal++;
  }
  const r = n => n/all;
  return { aggro: r(cheap)+r(haste)+r(burn), control: r(removal)+r(heal)+r(counters)+r(bigHp), fliers, antiAir, sweep, counters, burn };
}
function sweeperNear(op){
  // A board wipe the opponent could cast soon: one of their remaining Manifests, within 2 charge.
  for (const m of op.manifests){
    if (!/every enemy (basic )?creature|every creature/.test((m.text||"").toLowerCase())) continue;
    let short = 0; for (const el in m.mcost) short += Math.max(0, m.mcost[el] - (op.charge[el]||0));
    if (short<=2) return true;
  }
  return false;
}
// Recomputed at the start of each AI turn: choose a role from race math plus both decks' plans.
function strategicWeights(p){
  const op = opp(p);
  p.prof = p.prof || deckProfile(p); op.prof = op.prof || deckProfile(op);
  const power = q => q.board.filter(c=>!hasKw(c,"wall")).reduce((s,c)=>s+atkOf(c)-c.tAtk,0);
  // The opponent's board already holds what they played last turn; count what this turn's Energy can still add to ours,
  // or the AI reads every turn start as being behind and almost always defends.
  const myClock = op.life / Math.max(1, power(p) + p.energy + 2);
  const opClock = p.life / Math.max(1, power(op) + 2);
  let lean = (opClock - myClock) * 0.6 + (p.prof.aggro - op.prof.aggro) * 4 + (op.prof.control - p.prof.control) * 2;
  lean = Math.max(-1.5, Math.min(1.5, lean));         // + = race them, - = defend and grind
  const W = { ...AIW };
  W.pressure = AIW.pressure + 0.18*lean;
  W.danger = AIW.danger - 0.1*lean;
  W.life = AIW.life - 0.15*lean;
  W.hand = AIW.hand - 0.15*lean;
  W.atk = AIW.atk + 0.08*lean;
  W.hp = AIW.hp - 0.07*lean;
  if (op.prof.fliers >= 6 && p.prof.antiAir < op.prof.fliers) W.airBonus = 1.2;   // they fly: value anything that can block fliers
  if (op.prof.burn >= 6) W.lowAt = 8;                                              // they burn: protect your life total earlier
  if (sweeperNear(op)) W.sweepRisk = 0.9;                                          // don't overcommit into a board wipe
  W.role = lean>0.3 ? "race" : lean<-0.3 ? "defend" : "balanced";
  if (levelOf(p)>=5) W.cheat = true;
  return W;
}

/* ---- decisions ---- */
function aiBest(p, win, after, depth2){
  aiCtx(p);
  const pi = p.i, fin = after || (()=>{});
  const base = simulate(fin, pi) + 0.15;
  const scored = genActions(p, win).map(a=>({a, v:simulate(()=>{ applyAction(pi, a); fin(); }, pi)}));
  if (levelOf(p)>=5 && L5OPT.counter && !g.sim) for (const s of scored) counterAware(p, s, fin);
  if (depth2 && scored.length>1){
    // Look one play further for the most promising options, so the AI can sequence (ramp, then the big card).
    scored.sort((x,y)=>y.v-x.v);
    for (const s of scored.slice(0, levelOf(p)>=4 ? 7 : 4)){
      const saved = g; g = cloneState(saved);
      try {
        applyAction(pi, s.a);
        for (const b of genActions(g.P[pi], win)){
          const v = simulate(()=>{ applyAction(pi, b); fin(); }, pi);
          if (v>s.v) s.v = v;
        }
      } catch(e){ if (e!==OVER){ g = saved; throw e; } }
      g = saved;
    }
  }
  let best = null, bv = base;
  for (const s of scored) if (s.v>bv){ bv = s.v; best = s.a; }
  return best;
}
// Level 5 knows when you're holding a counter: assume you'll use it if it helps you.
function counterAware(p, s, fin){
  if (s.a.kind!=="card") return;
  const op = opp(p), d = p.hand[s.a.hi];
  const ci = op.hand.findIndex(c=>c.counter && costOf(c,op)<=op.energy && counterOK(c, d));
  if (ci<0) return;
  const pi = p.i;
  const v = simulate(()=>{ const P = g.P[pi], O = g.P[1-pi]; P.energy -= costOf(d,P); P.hand.splice(s.a.hi,1); P.grave.push(d);
    const c = O.hand[ci]; O.energy -= costOf(c,O); O.hand.splice(ci,1); if (c.afterCounter) c.afterCounter({p:O, o:P}); afterPlay(O,c,null); checkDeaths(); fin(); }, pi);
  if (v < s.v) s.v = v;
}
// Level 5: play out the rest of this turn and the opponent's whole next turn with their real hand and draws.
function simOppTurn(pi){
  const me = g.P[pi], op = g.P[1-pi];
  if (g.combat) resolveCombat(g.P[g.active]);
  endTurn(me);
  g.active = op.i; g.turnNo++;
  startTurn(op);
  g.phase = "main1";
  for (let i=0;i<6;i++){ const a = quickBest(op); if (!a) break; applyAction(op.i, a); }
  g.phase = "combat";
  const att = aiChooseAttack(op, true);
  simAttack(op.i, att.map(c=>c.uid));
  g.phase = "main2";
  for (let i=0;i<3;i++){ const a = quickBest(op); if (!a) break; applyAction(op.i, a); }
  endTurn(op);
  g.active = me.i; g.phase = "end";
}
// A full simulated turn at Adept quality (used by level 5 to forecast).
function syncMain(p, n){ for (let i=0;i<n;i++){ const a = aiBest(p, "main", null, true); if (!a) break; applyAction(p.i, a); } }
function syncCombat(p){
  const att = aiChooseAttack(p, true);
  if (!att.length) return;
  declareAttack(p, att);
  if (!g.combat) return;
  applyBlocks(aiPlanBlocks(1-p.i, true)); blockTriggers(opp(p));
  if (g.combat) resolveCombat(p);
}
function syncTurn(p, strong){
  g.phase="main1";
  if (strong){ const look = ()=>bestAttackAfter(p.i); for (let i=0;i<6;i++){ const a = aiBest(p, "main", look, true); if (!a) break; applyAction(p.i, a); } g.lookAhead = false; }
  else syncMain(p, 6);
  g.phase="combat"; syncCombat(p); g.phase="main2"; syncMain(p, 3);
}
function nextTurn(){ const cur = g.P[g.active]; endTurn(cur); g.active = 1-g.active; g.turnNo++; const nx = g.P[g.active]; startTurn(nx); return nx; }
// Finish my turn (stopNow: no more plays this main phase), then forecast `rounds` more turns.
function forecast(pi, stopNow, turns){
  const me = g.P[pi];
  if (g.combat) resolveCombat(g.P[g.active]);
  if (g.phase==="main1"){ if (!stopNow) syncMain(me, 5); g.phase="combat"; syncCombat(me); g.phase="main2"; syncMain(me, 3); }
  else if (!stopNow) syncMain(me, 3);
  let acc = 0;
  for (let i=0;i<turns;i++){ const nx = nextTurn(); syncTurn(nx, L5OPT.strongOpp && i===0); if (L5OPT.avgH) acc += evalState(pi); }
  if (L5OPT.avgH) g.hAvg = acc/turns;
}
// Forecast against a careful opponent and, optionally, a reckless one; combine the two.
function forecastValue(pi, apply, stopNow){
  const careful = simulate(()=>{ apply(); forecast(pi, stopNow, L5OPT.turns); }, pi);
  if (!L5OPT.mix) return careful;
  const reckless = simulate(()=>{ g.P[1-pi].aiW = AIW2; apply(); forecast(pi, stopNow, L5OPT.turns); }, pi);
  return L5OPT.mix==="min" ? Math.min(careful, reckless) : (careful + reckless)/2;
}
function sameAct(a, b){ return a && b && a.kind===b.kind && a.hi===b.hi && a.mi===b.mi && a.oc===b.oc && JSON.stringify(a.t)===JSON.stringify(b.t); }
// Greedy finish of the current turn: more plays, attack, second main phase.
function finishMyTurn(pi, stopNow){
  const p = g.P[pi];
  if (g.phase==="main1"){
    if (!stopNow) for (let i=0;i<5;i++){ const a = quickBest(p); if (!a) break; applyAction(pi, a); }
    const att = aiChooseAttack(p, true);
    simAttack(pi, att.map(c=>c.uid));
  }
  g.phase = "main2";
  for (let i=0;i<4;i++){ const a = quickBest(p); if (!a) break; applyAction(pi, a); }
}
// Level 5 in combat: let the other side answer with its best trick from its real hand.
function oppTrick(pi){
  const o = g.P[1-pi];
  let best = null, bv = simulate(finishCombat, o.i) + 0.3;
  for (const a of genActions(o, "instant")){ const v = simulate(()=>{ applyAction(o.i, a); finishCombat(); }, o.i); if (v>bv){ bv = v; best = a; } }
  if (best) applyAction(o.i, best);
}
function quickBest(p){
  const pi = p.i; let best = null, bv = simulate(()=>{}, pi) + 0.15;
  for (const a of genActions(p, "main")){ const v = simulate(()=>applyAction(pi, a), pi); if (v>bv){ bv = v; best = a; } }
  return best;
}
// Re-rank the top candidates by how the opponent's next turn would go.
function deepRank(p, cands, apply){
  const pi = p.i;
  let best = null, bv = -Infinity;
  for (const c of cands){
    const v = simulate(()=>{ apply(c); simOppTurn(pi); }, pi);
    if (v>bv){ bv = v; best = c; }
  }
  return best;
}
async function aiExec(p, a){
  await sleep(650);
  if (a.kind==="card") await castCard(p, a.hi, liveT(a.t), a.oc);
  else await castManifest(p, a.mi, liveT(a.t));
}
// In the first main phase, each option is scored by how the best attack plays out afterwards.
function bestAttackAfter(pi){
  if (g.phase!=="main1") return;
  g.lookAhead = true;
  const p = g.P[pi];
  const att = aiChooseAttack(p, levelOf(p)<4);
  simAttack(pi, att.map(c=>c.uid));
}
async function aiMain(p, phase){
  g.phase = phase;
  const L = levelOf(p);
  if (L===1){
    for (let guard=0; guard<10 && Math.random()<0.75; guard++){
      const opts = p.hand.map((d,hi)=>({d,hi})).filter(x=>!x.d.counter && canPlayNow(p,x.d,"main"));
      if (!opts.length) return;
      const {d, hi} = rnd(opts);
      let t = null;
      if (d.target){ const ts = targetsFor(d.target,p,true); const all = ts.length ? ts : targetsFor(d.target,p); if (all.length) t = rnd(all); }
      await sleep(650);
      await castCard(p, hi, t, canOC(p,d) && Math.random()<0.5);
    }
    return;
  }
  const look = L>=4 && phase==="main1" ? (()=>bestAttackAfter(p.i)) : null;
  for (let guard=0; guard<20; guard++){
    let a;
    if (L>=5 && L5OPT.deep){
      // Shortlist like a Strategist, then pick by playing out the rest of this turn
      // and the opponent's whole next turn with their real hand and draws.
      const pi = p.i;
      const first = aiBest(p, "main", look, true);
      const cand = genActions(p, "main").map(x=>({x, v:simulate(()=>{ applyAction(pi, x); if (look) look(); }, pi)})).sort((u,w)=>w.v-u.v).slice(0,L5OPT.k).map(s=>s.x);
      if (first && !cand.some(c=>sameAct(c, first))) cand.push(first);
      let bv = -Infinity; a = null;
      for (const c of [...cand, null]){
        const v = forecastValue(pi, ()=>{ if (c) applyAction(pi, c); }, c===null);
        if (v>bv + (c===null ? 0 : 0)){ bv = v; a = c; }
      }
    } else a = aiBest(p, "main", look, L>=3);
    if (L>=5 && !L5OPT.deep && false) {}
    if (!a) return;
    await aiExec(p, a);
  }
}
function applyBlocks(m){ for (const [au, bus] of m){ const bl = bus.map(findCr).filter(Boolean); if (bl.length) g.combat.blocks.set(au, bl); } }
function aiPlanBlocks(di, quick){
  const dp = g.P[di];
  aiCtx(dp);
  const att = g.combat.att.filter(a=>onBoard(a) && a.attacking);
  const B = dp.board.filter(b=>att.some(a=>canBlock(b,a)));
  if (!B.length) return new Map();
  // Inside look-ahead simulations, very wide boards use quick block rules (simulating every pairing gets too slow).
  if (quick && B.length*(att.length+1) > 30) return ruleBlocks(dp, att);
  const opts = B.map(b=>[null, ...att.filter(a=>canBlock(b,a)).map(a=>a.uid)]);
  const toMap = asg=>{ const m = new Map(); asg.forEach((au,i)=>{ if (au!=null){ if (!m.has(au)) m.set(au,[]); m.get(au).push(B[i].uid); } }); return m; };
  const cheat = levelOf(dp)>=5 && !g.sim && L5OPT.trick;
  const score = asg=>simulate(()=>{ applyBlocks(toMap(asg)); blockTriggers(g.P[di]); if (cheat) oppTrick(di); finishCombat(); }, di);
  const total = opts.reduce((s,o)=>s*o.length, 1);
  let cur = B.map(()=>null), cv = score(cur);
  if (!quick && total<=1500){
    const idx = B.map(()=>0), all = [];
    for (let k=0;k<total;k++){
      const asg = idx.map((j,i)=>opts[i][j]);
      const v = score(asg); all.push({asg, v}); if (v>cv+1e-9){ cv = v; cur = asg; }
      for (let i=0;i<idx.length;i++){ if (++idx[i]<opts[i].length) break; idx[i]=0; }
    }
    if (cheat && L5OPT.blocks && all.length>1){
      // Level 5: forecast the best few block plans through the following turns.
      all.sort((a,b)=>b.v-a.v);
      let bv = -Infinity;
      for (const c of all.slice(0,3)){

function ruleBlocks(dp, att){
  const m = new Map(), used = new Set();
  let incoming = att.reduce((s,a)=>s+atkOf(a),0);
  for (const a of [...att].sort((x,y)=>atkOf(y)-atkOf(x))){
    const avail = dp.board.filter(b=>!used.has(b) && canBlock(b,a));
    if (!avail.length) continue;
    let pick = avail.find(b=>atkOf(b)>=hpLeft(a) && hpLeft(b)>atkOf(a)) || avail.find(b=>hpLeft(b)>atkOf(a));
    if (!pick && incoming>=dp.life) pick = [...avail].sort((x,y)=>(x.d.cost||0)-(y.d.cost||0))[0];
    if (pick){ m.set(a.uid, [pick.uid]); used.add(pick); incoming -= atkOf(a); }
  }
  return m;
}
// Blocking by level: 1 random, 2 simple rules, 3+ simulated.
function aiDefend(dp){
  const L = levelOf(dp);
  const att = g.combat.att.filter(a=>onBoard(a) && a.attacking);
  const m = new Map(), used = new Set();
  const put = (a,b)=>{ if (!m.has(a.uid)) m.set(a.uid,[]); m.get(a.uid).push(b.uid); used.add(b); };
  if (L===1){
    for (const b of dp.board){ const can = att.filter(a=>canBlock(b,a)); if (can.length && Math.random()<0.4) put(rnd(can), b); }
    return m;
  }
  if (L===2){
    let incoming = att.reduce((s,a)=>s+atkOf(a),0);
    for (const a of [...att].sort((x,y)=>atkOf(y)-atkOf(x))){
      const avail = dp.board.filter(b=>!used.has(b) && canBlock(b,a));
      if (!avail.length) continue;
      let pick = avail.find(b=>atkOf(b)>=hpLeft(a) && hpLeft(b)>atkOf(a)) || avail.find(b=>hpLeft(b)>atkOf(a));
      if (!pick && incoming>=dp.life) pick = [...avail].sort((x,y)=>(x.d.cost||0)-(y.d.cost||0))[0];
      if (pick){ put(a, pick); incoming -= atkOf(a); }
    }
    return m;
  }
  return aiPlanBlocks(dp.i, L<4);
}
function simAttack(pi, uids, cheat){
  g.phase = "main2";
  if (!uids.length) return;
  const att = uids.map(findCr);
  declareAttack(g.P[pi], att);
  if (!g.combat) return;
  applyBlocks(aiPlanBlocks(1-pi, true));
  blockTriggers(g.P[1-pi]);
  if (cheat) oppTrick(pi);
  if (!g.combat) return;
  resolveCombat(g.P[pi]);
}
function aiChooseAttack(p, quick){
  const elig = p.board.filter(c=>canAttack(c) && atkOf(c)>0);
  if (!elig.length) return [];
  aiCtx(p);
  const n = elig.length, subsets = [];
  if (n<=(quick?3:5)){ for (let m=0;m<(1<<n);m++) subsets.push(elig.filter((_,i)=>m>>i&1)); }
  else { subsets.push([], elig); const key = quick && n>5 ? [...elig].sort((x,y)=>atkOf(y)-atkOf(x)).slice(0,3) : elig;   // wide boards in look-ahead: vary only the 3 biggest attackers
    key.forEach(c=>{ subsets.push([c]); subsets.push(elig.filter(x=>x!==c)); }); }
  const cheat = !quick && !g.sim && levelOf(p)>=5 && L5OPT.trick;
  const scored = subsets.map(S=>{ const uids = S.map(c=>c.uid); return {S, uids, v:simulate(()=>simAttack(p.i, uids, cheat), p.i)}; }).sort((a,b)=>b.v-a.v);
  if (!quick && !g.sim && levelOf(p)>=5 && L5OPT.deep){
    const top = scored.slice(0,L5OPT.k);
    let best = top[0], bv = -Infinity;
    for (const s of top){ const v = forecastValue(p.i, ()=>simAttack(p.i, s.uids, L5OPT.trick), false); if (v>bv){ bv = v; best = s; } }
    return best.S;
  }
  return scored[0].S;
}
// Attacking by level: 1 random, 2 simple rules, 3+ simulated.
function aiAttackers(p){
  const L = levelOf(p), o = opp(p);
  const elig = p.board.filter(c=>canAttack(c) && atkOf(c)>0);
  if (L===1) return elig.filter(()=>Math.random()<0.5);
  if (L===2){
    const blockers = o.board.filter(b=>!b.exhausted && !b.noBlock);
    if (!blockers.length) return elig;
    return elig.filter(c=>!blockers.some(b=>canBlock(b,c) && atkOf(b)>=hpLeft(c) && hpLeft(b)>atkOf(c)));
  }
  return aiChooseAttack(p, L<4);
}
async function aiCombatReact(p){
  const L = levelOf(p);
  if (L===1) return;
  for (let guard=0; guard<4; guard++){
    const a = aiBest(p, "instant", finishCombat);
    if (!a) return;
    await aiExec(p, a);
  }
}
async function aiInstantWindow(p){
  if (levelOf(p)<4) return;
  for (let guard=0; guard<3; guard++){

  }
}
function aiShouldCounter(o, d, t, oc){
  const L = levelOf(o);
  if (L===1) return -1;
  const hiC = o.hand.findIndex(c=>c.counter && canPlayNow(o,c,"respond") && counterOK(c, d));
  if (hiC<0) return -1;
  if (L===2) return (d.cost>=3 || (d.type==="creature" && (d.atk||0)>=4)) ? hiC : -1;
  aiCtx(o);
  const oi = o.i, ci = 1-oi, tr = refT(t);
  const vLet = simulate(()=>{ const P = g.P[ci]; const oc2 = oc && canOC(P,d); if (oc2) spendCharge(P,d.el,d.oc.cost); resolveCard(P,d,liveT(tr),oc2); finishCombat(); }, oi);
  const vCtr = simulate(()=>{ const O = g.P[oi], c = O.hand[hiC]; O.energy -= costOf(c,O); O.hand.splice(hiC,1); if (c.afterCounter) c.afterCounter({p:O, o:g.P[ci]}); afterPlay(O,c,null); checkDeaths(); finishCombat(); }, oi);
  return vCtr > vLet + 0.8 ? hiC : -1;
}
async function aiTurn(p){
  const L = levelOf(p);
  p.aiW = L===2 ? AIW2 : L>=4 ? strategicWeights(p) : (p.aiW && !p.aiW.role && !p.aiW.noThreat ? p.aiW : AIW);
  if (L>=4 && p.aiW.role!==p.lastRole){ p.lastRole = p.aiW.role; if (!HEADLESS) log(`Enemy plan: ${p.aiW.role==="race" ? "race you down" : p.aiW.role==="defend" ? "defend and outlast" : "play a balanced game"}.`, "big"); }
  await sleep(500);
  await aiMain(p, "main1");
  g.phase = "combat";
  let att = aiAttackers(p);
  if (att.length){
    const h = opp(p);
    if (!h.isAI) await reactionWindow(h, `The enemy is about to attack with ${att.map(c=>c.d.name).join(", ")}. You can play a Reaction first.`);
    att = att.filter(c=>onBoard(c) && canAttack(c));
    if (att.length){ await sleep(500); await runCombat(p, att); }
  }
  await aiMain(p, "main2");
  g.phase = "end";
  await sleep(300);
}

/* ---------------- Game setup ---------------- */
function newGame(myDeck, enemyDeck, enemyLife, kinds, opts){
  g = { id: Math.random(), screen:"game", P:[], active:0, turnNo:0, phase:"main1", ui:{mode:"idle"}, log:[], combat:null, over:null, cfg:{myDeck, enemyDeck, enemyLife} };
  // Each side starts at its element's life; a normal encounter gives the enemy 5 less.
  g.P = [ newPlayer(0, myDeck, "You", HEADLESS, deckLife(myDeck)), newPlayer(1, enemyDeck, "Enemy", true, deckLife(enemyDeck) + ((enemyLife ?? 15) - 15)) ];
  if (opts && opts.boss){ g.P[1].boss = opts.boss; g.P[1].phase = 1; }
  if (opts && opts.name) g.P[1].name = opts.name;
  g.P.forEach(p=>drawN(p,5));
  // A coin flip decides who goes first (simulations keep seat 0 first so seats can be alternated).
  const first = HEADLESS ? 0 : (Math.random() < 0.5 ? 0 : 1);
  g.active = first; g.P[1-first].energy = 1;
  if (!HEADLESS) g.coin = { first };
  const lv = k => typeof k==="number" ? k : 3;
  if (kinds){ g.P[0].level = lv(kinds[0]); g.P[1].level = lv(kinds[1]); }
  else g.P[1].level = setup.level;
  log(`${g.P[0].deckName} vs. ${g.P[1].deckName}. Coin flip: ${first===0 ? "you go first and skip your first draw. The enemy goes second and starts with 1 banked Energy." : "the enemy goes first and skips its first draw. You go second and start with 1 banked Energy."}`, "big");
  return runGame();
}

function rulesHTML(){
  return `<details class="rules"><summary>Playtest rules</summary><ul>
  <li>Each player starts with 5 cards and the life total of their deck's element (about 15; the deck list shows it). A coin flip decides who goes first; that player skips their first draw, and the player going second starts with 1 banked Energy.</li>
  <li>You gain 3 Energy each turn. Unspent Energy banks, up to 3 (Quarry Shaman raises the cap).</li>
  <li>Each basic card gives 1 charge of its element when it resolves. Countered cards give none.</li>
  <li>Manifests are cast from your Manifest deck by spending charge, during your main phase, once per game. Every deck has 4 Manifests.</li>
  <li>Creatures can't attack the turn they arrive unless they have Haste. As in Magic, attacking taps a creature and it stays tapped until the start of your next turn, so it can't block on the enemy's turn. Blocking doesn't tap. Every attack is a choice between pressure and defense.</li>
  <li>The defender picks blockers. Several creatures can gang-block one attacker; the attacker's damage goes to the first blocker until it would die, then the next.</li>
  <li>Airborne creatures can only be blocked by Airborne. Pierce sends excess damage to the player. Walls can't attack.</li>
  <li>Reactions can be played at any time: in your main phases, in combat, before the enemy attacks, or in response to an enemy card. Counters only work in response. Reactions on the enemy's turn are paid with banked Energy, so banking holds up answers.</li>
  <li>Fortify N: at the start of your turn, gains +N/+N. Ignite: a bonus if you spent charge this turn. Chain: counts other cards you played this turn. Overcharge: optionally spend charge for a bigger effect.</li>
  <li>Damage on creatures clears at the end of each turn. Hand limit is 7. Each side holds at most 8 creatures. Drawing from an empty deck deals growing damage.</li>
  <li>Targeted cards can choose any creature, yours or the enemy's (Ward only stops enemy cards). Fused cards always talk about their confluence's charge, never a base element's.</li>
  <li>Hover over or tap any card, including card names in the game log, to see its full details in the panel beside the board.</li>
  <li>Basic creatures that cost 4 or more give 2 charge. Rarity runs Starter and Common (baseline), Uncommon (stronger) and Rare (strongest).</li>
  <li>Keywords: ${Object.keys(KW_NAMES).map(k=>`<b>${KW_NAMES[k]}</b>: ${KW_REMIND[k]}`).join(" ")}</li>
  <li>Fusion: two cards of the same type from a dual confluence's elements make a dual card; a dual card plus a card of the missing element makes a triple card (the same as fusing all three base cards). Special recipes turn specific card sets into unique cards. Every fused or special card gives 1 charge of its confluence, and a confluence deck's charge is all that confluence's.</li>
  <li>Zaps: "deal N damage to a random enemy creature X times" picks a new target each time. Fortify can also be given to a creature by a card.</li>
  <li>Special mechanics: Desperate N (a bonus while your life is N or less), Last Gasp, token copies, silence (removes all abilities and keywords), take control, transform, swap (attack and health trade places), sacrifice (destroy your own creature with the lowest attack, often for damage equal to its attack), and putting creatures from your grave back into play.</li>
  <li>Prototype simplifications: one round of combat Reactions per side, and Manifest creatures can't be returned to hand.</li>
  </ul></details>`;
}
// Card names in the log become hoverable links to that card's details.
function logNames(){
  if (g.logNames) return g.logNames;
  const byName = new Map();
  const add = d => { if (d && d.name && !byName.has(d.name)) byName.set(d.name, d); };
  for (const ref of [g.cfg.myDeck, g.cfg.enemyDeck]){ const dk = deckOf(ref); if (dk) [...dk.main, ...dk.manifests].forEach(id => add(LIB[id])); }
  Object.values(TOKENS).forEach(add);
  const names = [...byName.keys()].sort((a,b)=>b.length-a.length).map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  g.logNames = { byName, re: names.length ? new RegExp(`(${names.join("|")})`, "g") : null };
  return g.logNames;
}
function logLineHTML(s){
  const { byName, re } = logNames();
  if (!re) return esc(s);
  return String(s).split(re).map((part, i) => i%2 && byName.has(part)
    ? `<span class="logcard el-${byName.get(part).el}" data-logcard="${esc(byName.get(part).id)}" tabindex="0" role="button">${esc(part)}</span>` : esc(part)).join("");
}
function inspectFrom(el){
  if (!g || g.screen!=="game" || !el) return false;
  const ds = el.dataset, me = g.P[0], en = g.P[1];
  let s = null;
  if (ds.cr!=null) s = { uid:+ds.cr };
  else if (ds.hand!=null && me.hand[+ds.hand]) s = { def:me.hand[+ds.hand], where:"In your hand", hand:true };
  else if (ds.man!=null && me.manifests[+ds.man]) s = { def:me.manifests[+ds.man], where:"Your Manifest deck", owner:me };
  else if (ds.emani!=null && en.manifests[+ds.emani]) s = { def:en.manifests[+ds.emani], where:"Enemy Manifest deck", owner:en };
  else if (ds.aura){ const [pi,ai] = ds.aura.split("-").map(Number); const a = g.P[pi].auras[ai]; if (a) s = { def:a, where:(pi?"Enemy":"Your")+" aura in play" }; }
  else if (ds.logcard){
    const d = LIB[ds.logcard] || Object.values(TOKENS).find(t=>t.id===ds.logcard);
    const live = [...g.P[0].board, ...g.P[1].board].find(c=>c.d.id===ds.logcard);
    if (live) s = { uid:live.uid }; else if (d) s = { def:d, where:"From the game log (not in play now)" };
  }
  if (!s) return false;
  const cur = g.inspect;
  if (cur && cur.uid===s.uid && cur.def===s.def && cur.where===s.where) return true;
  g.inspect = s;
  const box = document.getElementById("insp"); if (box) box.innerHTML = inspectorHTML();
  return true;
}
function remindersHTML(d, c){
