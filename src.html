  if (d.fort) keys.add("fortify");
  for (const [k,w] of [["ignite","ignite"],["chain","chain "],["attuned","attuned"],["overcharge","overcharge"],["lastgasp","last gasp"],["desperate","desperate"]]) if (t.includes(w)) keys.add(k);
  if (!keys.size) return "";
  const name = k => KW_NAMES[k] || {fortify:"Fortify N", ignite:"Ignite", chain:"Chain N", attuned:"Attuned N", overcharge:"Overcharge N", lastgasp:"Last Gasp", desperate:"Desperate N"}[k];
  return `<dl class="remind">${[...keys].map(k=>`<dt>${name(k)}</dt><dd>${KW_REMIND[k]}</dd>`).join("")}</dl>`;
}
function inspectorHTML(){
  const s = g && g.inspect;
  const empty = `<span class="lbl">Card details</span><p class="muted">Hover over or tap any card to see its cost, stats, keywords and full text: creatures and auras on either side, your hand, and both Manifest decks.</p>`;
  if (!s) return empty;
  let c = null, d = s.def, where = s.where;
  if (s.uid!=null){
    c = [...g.P[0].board, ...g.P[1].board].find(x=>x.uid===s.uid);
    if (!c) return empty.replace("</p>"," That creature has left the field.</p>");
    d = c.d; where = c.owner ? "Enemy creature in play" : "Your creature in play";
  }
  const me = g.P[0];
  const typeLabel = (d.manifest?"Manifest ":"") + d.type[0].toUpperCase()+d.type.slice(1);
  let cost;
  if (d.manifest){
    const owner = s.owner || (c ? g.P[c.owner] : null);
    cost = `${Object.entries(d.mcost).map(([el,n])=>`${n} ${ELS[el]} charge`).join(" + ")}${owner?` <span class="muted">(${owner.isAI?"enemy has":"you have"} ${Object.keys(d.mcost).map(el=>owner.charge[el]||0).join("/")})</span>`:""}`;
  } else {
    cost = `${d.cost} Energy`;
    if (s.hand){ const now = costOf(d,me); if (now!==d.cost) cost += ` <span class="muted">(${now} right now)</span>`; }
  }
  const rows = [["Cost", cost], ["Gives", d.manifest ? "No charge (Manifest)" : d.token ? "No charge (token)" : `${d.charge} ${ELS[d.el]} charge when it resolves`]];
  if (d.type==="reaction") rows.push(["Timing", d.counter ? "Only in response to an enemy card" : "Any time you have the Energy, on either turn"]);
  if (d.type==="creature"){
    if (c){
      const perm = c.atk - d.atk, permH = c.hp - d.hp;
      const sky = atkOf(c) - c.atk - c.tAtk;
      const bits = [`base ${d.atk}`]; if (perm) bits.push(`${perm>0?"+":""}${perm} permanent`); if (c.tAtk) bits.push(`+${c.tAtk} this turn`); if (sky>0) bits.push(`+${sky} from auras`);
      const hb = [`base ${d.hp}`]; if (permH) hb.push(`${permH>0?"+":""}${permH} permanent`); if (c.tHp) hb.push(`+${c.tHp} this turn`); if (c.dmg) hb.push(`${c.dmg} damage taken`);
      rows.push(["Attack", `<b>${atkOf(c)}</b> <span class="muted">(${bits.join(", ")})</span>`]);
      rows.push(["Health", `<b>${hpLeft(c)}/${hpOf(c)}</b> <span class="muted">(${hb.join(", ")})</span>`]);
    } else rows.push(["Stats", `${d.atk} ATK / ${d.hp} HP`]);
  }
  const kws = kwLine(d);
  if (c){ ["airborne"].forEach(k=>{ if (hasKw(c,k) && !d.kw.includes(k)) kws.push("Airborne (granted)"); }); }
  if (kws.length) rows.push(["Keywords", kws.join(", ")]);
  const status = [];
  if (c){
    if (c.attacking) status.push("Attacking");
    if (c.frozen) status.push("Frozen: doesn't untap at the start of its controller's next turn");
    if (c.exhausted && !c.frozen) status.push("Tapped: can't attack or block until it untaps at the start of its controller's turn");
    if (c.sick && !hasKw(c,"haste") && !hasKw(c,"wall") && g.active===c.owner) status.push("Just arrived: can attack next turn");
    if (c.noBlock) status.push("Can't block this turn");
    if (!status.length) status.push("Ready");
  }
  if (s.hand && g.P[0].hand.includes(d) && g.ui.mode==="main"){ const why = whyNotPlayable(g.P[0], d, "main"); if (why) status.push("Can't play now: "+why); }
  if (s.owner===g.P[0] && d.manifest && g.ui.mode==="main"){ const why = whyNotPlayable(g.P[0], d, "main"); if (why) status.push("Can't cast now: "+why); }
  return `<span class="lbl">Card details · ${esc(where)}</span>
    <div class="insp-card el-${d.el}"><h3>${d.manifest?'<span class="star-in">✦</span> ':""}${esc(d.name)}</h3>
    <div class="insp-meta">${ELS[d.el]} · ${typeLabel} · ${RARITY[d.r]}</div><div class="artbox lg">${cardArt(d)}</div>
    <dl>${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    <p class="insp-text">${kwText(d.text)}</p>${remindersHTML(d, c)}
    ${status.length?`<div class="insp-status">${status.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}</div>`;
}

/* ---------------- Win rates tab ----------------
   Every deck against every other deck (WINRATES, from simulation). Two views: element vs element (all of an element's
   decks pooled) and deck vs deck. Rows are the deck or element whose win rate is shown. */
const WR_SHORT = { starter:"S", common:"C", uncommon:"U", rare:"R", special:"A" };
function wrDecks(){
  const f = setup.wr, grpOf = el => BASE_ELS.includes(el) ? "mono" : CONFLUENCE[el].length===2 ? "dual" : "tri";
  const order = [...BASE_ELS, ...DUAL_ELS, ...TRIPLE_ELS], tOrd = { starter:0, common:1, uncommon:2, rare:3, special:4 };
  return Object.values(DECK_BY_ID).filter(d => (f.group==="all" || grpOf(d.el)===f.group) && (f.tier==="all" || d.tier===f.tier))
    .sort((a,b)=> order.indexOf(a.el)-order.indexOf(b.el) || tOrd[a.tier]-tOrd[b.tier] || a.id.localeCompare(b.id));
}
const wrSet = () => WINRATES[setup.wr.lv] || WINRATES[Object.keys(WINRATES)[0]];
function wrPair(a, b){            // [wins for a, games]
  if (a===b) return null;
  const R = wrSet().r, x = R[a+"|"+b]; if (x) return x;
  const y = R[b+"|"+a]; return y ? [y[1]-y[0], y[1]] : null;
}
function wrCell(w, n, extra){
  if (!n) return `<td class="wr-na">–</td>`;
  const p = 100*w/n, d = Math.max(-1, Math.min(1, (p-50)/35));
  const bg = d>=0 ? `color-mix(in srgb, var(--good) ${Math.round(d*70)}%, transparent)` : `color-mix(in srgb, var(--bad) ${Math.round(-d*70)}%, transparent)`;
  return `<td style="background:${bg}" title="${extra} · ${p.toFixed(0)}% of ${n} games">${Math.round(p)}</td>`;
}
function winratesHTML(){
  const f = setup.wr; let decks = wrDecks();
  const overall = id => { let w=0, n=0; for (const b of decks){ const x = wrPair(id, b.id); if (x){ w+=x[0]; n+=x[1]; } } return n ? w/n : 0; };
  if (f.sort==="wr" && f.view==="deck") decks = [...decks].sort((a,b)=>overall(b.id)-overall(a.id));
  const opt = (key, val, label)=>`<button class="fbtn ${f[key]===val?"on":""}" data-wr="${key}:${val}">${label}</button>`;
  const short = d => `${esc(ELS[d.el])} ${WR_SHORT[d.tier]}${(DECKS[d.el]||[]).filter(x=>x.tier===d.tier).length>1 ? (DECKS[d.el].filter(x=>x.tier===d.tier).indexOf(d)+1) : ""}`;
  const head = `<div class="filters">
    <div class="frow"><span class="lbl">AI level</span>${Object.keys(WINRATES).map(l=>opt("lv",l,`Level ${l} ${AI_LEVELS[l].name}`)).join("")}</div>
    <div class="frow"><span class="lbl">View</span>${opt("view","el","Element vs element")}${opt("view","deck","Deck vs deck")}</div>
    <div class="frow"><span class="lbl">Decks</span>${opt("group","all","All")}${opt("group","mono","Mono")}${opt("group","dual","Dual")}${opt("group","tri","Triple")}</div>
    <div class="frow"><span class="lbl">Order</span>${opt("sort","el","By element and rarity")}${opt("sort","wr","Strongest first")}</div>
    <div class="frow"><span class="lbl">Rarity</span>${opt("tier","all","All")}${["starter","common","uncommon","rare","special"].map(t=>opt("tier",t,TIER_NAME[t])).join("")}</div>
    <p class="muted" style="margin:0">Each number is the <b>row's</b> win % against the column, from ${wrSet().meta.games} games per pairing (seats alternated) with both sides on AI level ${wrSet().meta.level}, starting life by element. At ${wrSet().meta.games} games a single cell can be off by about ${Math.round(100/Math.sqrt(wrSet().meta.games)/2)} points; pooled cells and "All" are steadier. Green means the row wins more, red less. Hover a cell for the exact games. "All" is the row's win % against every deck in the current filter.</p>
  </div>`;
  let table;
  if (f.view==="el"){
    let els = [...new Set(decks.map(d=>d.el))];
    const byEl = el => decks.filter(d=>d.el===el);
    const agg = (A, B) => { let w=0, n=0; for (const a of A) for (const b of B){ const x = wrPair(a.id, b.id); if (x){ w+=x[0]; n+=x[1]; } } return [w,n]; };
    if (f.sort==="wr"){ const v = e => { const r = agg(byEl(e), decks); return r[1] ? r[0]/r[1] : 0; }; els = [...els].sort((a,b)=>v(b)-v(a)); }
    const rows = els.map(e => { const A = byEl(e); const all = agg(A, decks);
      return `<tr><th class="wr-row el-${e}" scope="row"><button class="wr-link" data-wr="focus:${e}"><b>${esc(ELS[e])}</b></button><span class="muted"> · ${A.length} deck${A.length>1?"s":""} · ♥ ${EL_LIFE[e]||15}</span></th>${wrCell(all[0], all[1], ELS[e]+" vs all")}${els.map(c => { const r = agg(A, byEl(c)); return wrCell(r[0], r[1], ELS[e]+" vs "+ELS[c]); }).join("")}</tr>`; }).join("");
    table = `<table class="wr"><thead><tr><th class="wr-corner">Row wins vs →</th><th>All</th>${els.map(e=>`<th class="el-${e}"><span class="wr-col">${esc(ELS[e])}</span></th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`;
  } else {
    const rows = decks.map(a => { let w=0, n=0; for (const b of decks){ const x = wrPair(a.id, b.id); if (x){ w+=x[0]; n+=x[1]; } }
      return `<tr><th class="wr-row el-${a.el}" scope="row"><b>${esc(a.name)}</b><span class="muted"> · ${short(a)} · ♥ ${deckLife(a.id)}</span></th>${wrCell(w, n, a.name+" vs all")}${decks.map(b => { const x = wrPair(a.id, b.id); return x ? wrCell(x[0], x[1], a.name+" vs "+b.name) : a.id===b.id ? `<td class="wr-self" title="Same deck">—</td>` : `<td class="wr-na">?</td>`; }).join("")}</tr>`; }).join("");
    table = `<table class="wr"><thead><tr><th class="wr-corner">Row wins vs →</th><th>All</th>${decks.map(d=>`<th class="el-${d.el}" title="${esc(d.name)}"><span class="wr-col">${short(d)}</span></th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`;
  }
  let focus = "";
  if (f.view==="el" && f.focus){
    const A = Object.values(DECK_BY_ID).filter(d=>d.el===f.focus).sort((x,y)=>["starter","common","uncommon","rare","special"].indexOf(x.tier)-["starter","common","uncommon","rare","special"].indexOf(y.tier));
    const rows = A.map(a => { let w=0, n=0; for (const b of decks){ const x = wrPair(a.id, b.id); if (x){ w+=x[0]; n+=x[1]; } }
      return `<tr><th class="wr-row el-${a.el}" scope="row"><b>${esc(a.name)}</b><span class="muted"> · ${TIER_NAME[a.tier]}</span></th>${wrCell(w, n, a.name+" vs all")}${[...new Set(decks.map(d=>d.el))].map(c => { let w2=0, n2=0; for (const b of decks.filter(d=>d.el===c)){ const x = wrPair(a.id, b.id); if (x){ w2+=x[0]; n2+=x[1]; } } return wrCell(w2, n2, a.name+" vs "+ELS[c]); }).join("")}</tr>`; }).join("");
    focus = `<div class="wr-focus"><div class="row"><span class="lbl">${esc(ELS[f.focus])} decks, one by one</span><button class="fbtn" data-wr="focus:">Close</button></div>
      <div class="wr-scroll"><table class="wr"><thead><tr><th class="wr-corner">Row wins vs →</th><th>All</th>${[...new Set(decks.map(d=>d.el))].map(e=>`<th class="el-${e}"><span class="wr-col">${esc(ELS[e])}</span></th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  return `${head}${focus}<div class="wr-scroll">${table}</div>`;
}

function onClick(e){
  const el = e.target.closest("[data-logcard],[data-forge],[data-forgef],[data-recipe],[data-btn],[data-hand],[data-man],[data-cr],[data-pl],[data-tab],[data-pickel],[data-pickdeck],[data-lib],[data-life],[data-level],[data-aura],[data-emani],[data-wr],[data-rpgstart],[data-rpgnext]");
  if (!el) return;
  if (rpgClick(el)) return;
  inspectFrom(el);
  const ds = el.dataset;
  if (ds.tab){ setup.tab=ds.tab; render(); return; }
  if (ds.wr!=null){ const i = ds.wr.indexOf(":"), k = ds.wr.slice(0,i), v = ds.wr.slice(i+1); setup.wr[k] = v || null; if (k==="focus" && v) setup.wr.view = "el"; render(); return; }
  if (ds.forge){ const i=ds.forge.indexOf(":"), e=ds.forge.slice(0,i), id=ds.forge.slice(i+1); const f=setup.forge; f.pick[e] = f.pick[e]===id ? null : id; render(); return; }
  if (ds.forgef){ const [k,v]=ds.forgef.split(":"); const f=setup.forge; f[k]=v; if (k==="type" || k==="conf") f.pick={}; render(); return; }
  if (ds.recipe){ const d=LIB[ds.recipe], ps=parentsOf(d); const f=setup.forge; f.conf=d.el; f.type=ps[0].type; f.r="all"; f.q=""; f.pick={}; for (const c of ps) f.pick[c.el]=c.id; setup.tab="forge"; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if (ds.pickel){ const [side,e]=ds.pickel.split(":"); setup[side==="my"?"myEl":"enemyEl"]=e; setup[side]=DECKS[e][0].id; setup.view=setup[side]; render(); return; }
  if (ds.pickdeck){ const [side,id]=ds.pickdeck.split(":"); setup[side]=id; setup.view=id; render(); return; }
  if (ds.lib){ const [k,v]=ds.lib.split(":"); if (k==="more") setup.lib.limit += 120; else { setup.lib[k]=v; setup.lib.limit=120; } render(); return; }
  if (ds.life){ setup.life=+ds.life; render(); return; }
  if (ds.level){ setup.level=+ds.level; render(); return; }
  if (ds.btn==="start" || ds.btn==="again"){ const c = g&&g.cfg ? g.cfg : null; if(ds.btn==="start" || !c) newGame(setup.my, setup.enemy, setup.life); else newGame(c.myDeck, c.enemyDeck, c.enemyLife); return; }
  if (ds.btn==="decks"){ if(g) g.id = Math.random(); g = null; render(); return; }
  if (!g) return;
  if (ds.btn==="close"){ g.closed=true; render(); return; }
  const ui = g.ui, me = g.P[0];
  switch (ui.mode){
    case "main":
      if (ds.hand!=null){ const d = me.hand[+ds.hand]; if (d && canPlayNow(me, d, "main")) finishUI({hand:+ds.hand}); else if (d){ g.notice = `${d.name}: ${whyNotPlayable(me, d, "main")||"can't be played right now."}`; render(); } }
      else if (ds.man!=null){ const m = me.manifests[+ds.man]; if (m && canCastManifest(me, m)) finishUI({man:+ds.man}); else if (m){ g.notice = `${m.name}: ${whyNotPlayable(me, m, "main")||"can't be cast right now."}`; render(); } }
      else if (ds.btn==="next") finishUI("next");
      break;
    case "react":
      if (ds.hand!=null){ if (canPlayNow(me, me.hand[+ds.hand], "instant")) finishUI(+ds.hand); }
      else if (ds.btn==="done") finishUI("done");
      break;
    case "target": {
      if (ds.btn==="cancel") return finishUI("cancel");
      if (ds.btn==="skip") return finishUI("skip");
      let t = null;
      if (ds.cr!=null) t = ui.valid.find(x=>x.kind==="creature" && x.c.uid===+ds.cr);
      else if (ds.pl!=null) t = ui.valid.find(x=>x.kind==="player" && x.p.i===+ds.pl);
      if (t) finishUI(t);
      break;
    }
    case "attack":
      if (ds.cr!=null){ const c = me.board.find(x=>x.uid===+ds.cr); if (c && canAttack(c)){ ui.sel.has(c.uid)?ui.sel.delete(c.uid):ui.sel.add(c.uid); render(); } }
      else if (ds.btn==="attack") finishUI([...ui.sel]);
      else if (ds.btn==="skip") finishUI([]);
      break;
    case "block":
      if (ds.cr!=null){
        const uid = +ds.cr;
        const enemyAtt = g.P[1].board.find(x=>x.uid===uid && x.attacking);
        if (enemyAtt){ ui.sel = uid; render(); break; }
        const mine = me.board.find(x=>x.uid===uid);
        if (mine){
          if (ui.assign.has(uid)) ui.assign.delete(uid);
          else if (ui.sel){ const a = g.P[1].board.find(x=>x.uid===ui.sel); if (a && canBlock(mine,a)) ui.assign.set(uid, ui.sel); }
          render();
        }
      } else if (ds.btn==="confirm") finishUI(ui.assign);
      break;
    case "confirm":
      if (ds.btn==="yes") finishUI(true); else if (ds.btn==="no") finishUI(false);
      break;
    case "respond":
      if (ds.btn==="pass") finishUI("pass");
      else if (ds.btn && ds.btn.startsWith("opt-")) finishUI(+ds.btn.slice(4));
      break;
  }
}

  const hideTip = () => { tip.hidden = true; tipFor = null; };
  document.addEventListener("pointerdown", e=>{ lastPointer = e.pointerType || "mouse"; }, true);
  document.addEventListener("mouseover", e=>{ const t = e.target.closest && e.target.closest(".kwt"); if (t) showTip(t); else if (tipFor && lastPointer==="mouse") hideTip(); });
  document.addEventListener("focusin", e=>{ const t = e.target.closest && e.target.closest(".kwt"); if (t) showTip(t); });
  document.addEventListener("focusout", e=>{ if (e.target===tipFor) hideTip(); });
  // On touch, tapping a term shows its help instead of playing or selecting the card it sits on.
  document.addEventListener("click", e=>{ const t = e.target.closest && e.target.closest(".kwt");
    if (t && lastPointer!=="mouse"){ e.preventDefault(); e.stopPropagation(); if (tipFor===t && Date.now()-tipAt > 500) hideTip(); else showTip(t); }
    else if (!t && lastPointer!=="mouse") hideTip(); }, true);
  window.addEventListener("scroll", hideTip, true);
  document.addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.matches('[role="button"]')){ e.preventDefault(); e.target.click(); } });
  render();
} else {
  globalThis.__sim = { newGame, get g(){ return g; }, LIB, DECKS };
}
</script>
